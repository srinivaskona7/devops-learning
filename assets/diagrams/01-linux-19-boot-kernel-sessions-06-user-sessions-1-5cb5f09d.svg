5, 83)"><rect class="basic label-container" style="" x="-103.25" y="-39" width="206.5" height="78"/><g class="label" style="" transform="translate(-73.25, -24)"><rect/><foreignObject width="146.5" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>login calls PAM stack<br />/etc/pam.d/login</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-9" transform="translate(1500.546875, 83)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>PAM modules:<br />pam_unix, pam_securetty,<br />pam_nologin, pam_env,<br />pam_limits, pam_systemd, ...</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-11" transform="translate(1769.9921875, 83)"><rect class="basic label-container" style="" x="-89.4453125" y="-63" width="178.890625" height="126"/><g class="label" style="" transform="translate(-59.4453125, -48)"><rect/><foreignObject width="118.890625" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>On success:<br />setuid to user,<br />set HOME, PATH,<br />chdir(HOME)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-H-13" transform="translate(2039.4375, 83)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>exec user shell from /etc/passwd<br />(usually /bin/bash)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-I-15" transform="translate(2340.8125, 83)"><rect class="basic label-container" style="" x="-121.375" y="-39" width="242.75" height="78"/><g class="label" style="" transform="translate(-91.375, -24)"><rect/><foreignObject width="182.75" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>bash sources /etc/profile<br />then /etc/profile.d/*.sh</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-J-17" transform="translate(2642.1875, 83)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>bash sources ~/.bash_profile<br />(or ~/.profile)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-K-19" transform="translate(2939.0234375, 83)"><rect class="basic label-container" style="" x="-116.8359375" y="-27" width="233.671875" height="54"/><g class="label" style="" transform="translate(-86.8359375, -12)"><rect/><foreignObject width="173.671875" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>interactive shell prompt</p></span></div></foreignObject></g></g></g></g></g></svg>