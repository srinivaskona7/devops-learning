# ─────────────────────────────────────────────────────────────────────────────
# Project 01 · DevOps Learning Lab — hardened Nginx config
#
# Goals:
#   - No information disclosure (server_tokens off)
#   - Security headers on every response (X-Frame, nosniff, CSP, Referrer)
#   - Gzip for text assets (saves ~70% on HTML/CSS over the wire)
#   - tmpfs-safe temp paths (read-only rootfs compatibility)
#   - Logs to stdout/stderr (Docker/K8s log drivers pick them up automatically)
#   - Only GET/HEAD/OPTIONS allowed (405 everything else)
#
# Tested with: nginx/1.27 (alpine-slim)
# ─────────────────────────────────────────────────────────────────────────────

# nginx master runs as root briefly to bind :80, then forks workers as `nginx`
# (uid=101). This `user` directive matches the built-in nginx:alpine user.
user  nginx;

# `auto` spawns one worker per CPU core. For a 2-core container that's 2.
# For learning, 1 is fine and reduces log noise.
worker_processes  auto;

# PID file lives in a tmpfs mount — required for read-only rootfs.
pid  /var/run/nginx.pid;

# Raise the file descriptor limit for high-concurrency scenarios.
worker_rlimit_nofile 65535;

events {
    # Maximum simultaneous connections per worker.
    worker_connections 1024;

    # Accept as many connections as possible at once when a worker wakes up.
    multi_accept on;
}

http {
    # ── MIME types ──────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # ── Performance ─────────────────────────────────────────────────────
    # sendfile: kernel copies file → socket without a userland buffer copy.
    # tcp_nopush: send the full response header + start of body in one packet.
    # tcp_nodelay: disable Nagle for keep-alive connections (reduces latency).
    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;

    # Keep connections open for 30 s; max 100 requests per connection.
    # Lower than nginx default (75 s) — appropriate for a small static site.
    keepalive_timeout  30s;
    keepalive_requests 100;

    # Reject oversized request bodies immediately (static site — nothing to POST).
    client_max_body_size 1m;

    # ── Security: information disclosure ────────────────────────────────
    # Hides "nginx/1.27.x" from the Server response header and error pages.
    # An attacker scanning for CVEs can no longer target the exact version.
    server_tokens off;

    # ── tmpfs-compatible temp paths ──────────────────────────────────────
    # When running with --read-only, all temp dirs must point inside the
    # /var/cache/nginx tmpfs mount. These five lines replace nginx's defaults.
    client_body_temp_path  /var/cache/nginx/client_temp;
    proxy_temp_path        /var/cache/nginx/proxy_temp;
    fastcgi_temp_path      /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path        /var/cache/nginx/uwsgi_temp;
    scgi_temp_path         /var/cache/nginx/scgi_temp;

    # ── Logging → Docker log driver ─────────────────────────────────────
    # Writing to /dev/stdout and /dev/stderr means `docker logs` and
    # kubectl logs capture every access and error automatically.
    access_log  /dev/stdout;
    error_log   /dev/stderr warn;

    # ── Gzip compression ────────────────────────────────────────────────
    # Saves ~70% on HTML and CSS over the wire. The Vary: Accept-Encoding
    # header tells CDNs to cache both compressed and uncompressed versions.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Virtual server ──────────────────────────────────────────────────
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ── Security headers on every response ──────────────────────────
        # These four headers close multiple OWASP Top-10 attack vectors.

        # Prevent this page from being embedded in <iframe> (clickjacking).
        add_header X-Frame-Options "DENY" always;

        # Prevent browsers from guessing a file's MIME type (MIME sniffing attacks).
        add_header X-Content-Type-Options "nosniff" always;

        # Control what information the browser sends in Referer headers.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Disable browser APIs this static site doesn't need.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Content Security Policy — restricts where resources can load from.
        # - default-src 'self'         : no inline scripts or external resources by default
        # - style-src 'self' 'unsafe-inline' fonts.googleapis.com : allow Google Fonts CSS
        # - font-src 'self' fonts.gstatic.com : allow Google Fonts files
        # - img-src 'self' data:        : allow inline SVG favicons
        # - frame-ancestors 'none'      : redundant with X-Frame-Options, defence-in-depth
        add_header Content-Security-Policy
            "default-src 'self'; "
            "img-src 'self' data:; "
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
            "font-src 'self' https://fonts.gstatic.com; "
            "script-src 'self'; "
            "connect-src 'self'; "
            "frame-ancestors 'none'; "
            "base-uri 'self'; "
            "form-action 'self'"
            always;

        # ── Static asset caching ─────────────────────────────────────────
        # CSS and JS can be cached for 1 day. The Cache-Control header tells
        # browsers and CDNs to revalidate after 24 h.
        # IMPORTANT: add_header is NOT inherited from the parent block once
        # any add_header appears inside a location. Re-declare all headers.
        location ~* \.(css|js|svg|woff2?)$ {
            expires 1d;
            add_header Cache-Control          "public, max-age=86400, must-revalidate" always;
            add_header X-Frame-Options        "DENY"                                   always;
            add_header X-Content-Type-Options "nosniff"                                always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin"        always;
            try_files $uri =404;
        }

        # ── HTML root ────────────────────────────────────────────────────
        # try_files checks $uri first, then $uri/ (directory index),
        # then falls back to index.html (SPA-style routing, future-proofing).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Method filter ────────────────────────────────────────────────
        # A static site has no reason to accept POST, PUT, DELETE, PATCH.
        # Returning 405 at nginx level avoids any app logic being invoked.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }

        # ── Custom error pages (inline — no extra files needed) ──────────
        error_page 404 /404.html;
        location = /404.html {
            return 404 "404 · not found\n";
            add_header Content-Type "text/plain; charset=utf-8" always;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 500 "500 · server error\n";
            add_header Content-Type "text/plain; charset=utf-8" always;
        }
    }
}
