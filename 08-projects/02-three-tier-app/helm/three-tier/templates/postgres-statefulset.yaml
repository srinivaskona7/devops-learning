apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "three-tier.fullname" . }}-postgres
  labels: {{- include "three-tier.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "three-tier.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      tier: data
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        tier: data
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: {{ include "three-tier.fullname" . }}-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "three-tier.fullname" . }}-postgres
  labels: {{- include "three-tier.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    tier: data
  ports:
    - port: {{ .Values.service.postgresPort }}
      targetPort: 5432
      name: postgres
