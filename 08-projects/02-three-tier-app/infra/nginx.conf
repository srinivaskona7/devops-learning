# nginx.conf — URL Shortener reverse proxy
#
# Traffic model:
#   client → :80 → nginx → api:8000  (all /api/* and /:code paths)
#   client → :80 → nginx → static    (index.html, styles.css)
#
# Security posture:
#   - server_tokens off   (no version leak)
#   - X-Frame-Options, X-Content-Type-Options, Referrer-Policy on all responses
#   - 10s proxy timeouts (fast-fail; don't hang the client on a dead API)

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide version
    server_tokens off;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" us=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Upstream — Docker internal DNS resolves "api" to the api container.
    # If api is scaled (--scale api=3), Docker round-robins across replicas.
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Security headers (applied to every response) ─────────────────
        add_header X-Frame-Options        "DENY"            always;
        add_header X-Content-Type-Options "nosniff"         always;
        add_header Referrer-Policy        "no-referrer"     always;
        add_header X-XSS-Protection       "1; mode=block"   always;

        # ── API proxy ────────────────────────────────────────────────────
        # Routes: /api/*, /healthz, /ready, and /:code (single segment)
        location /api/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 5s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }

        location /healthz {
            proxy_pass         http://api_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        location /ready {
            proxy_pass         http://api_backend/ready;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # Short-code redirect: single path segment that is not a file/dir
        # Regex: exactly one path segment with alphanumeric chars (base-62)
        location ~ ^/([A-Za-z0-9]{4,12})$ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection      "";
            proxy_connect_timeout 5s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }

        # ── Static frontend ──────────────────────────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively
            location ~* \.(css|js|ico|png|svg|woff2)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                add_header X-Frame-Options        "DENY"        always;
                add_header X-Content-Type-Options "nosniff"     always;
            }
        }

        # ── Custom error pages ───────────────────────────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
