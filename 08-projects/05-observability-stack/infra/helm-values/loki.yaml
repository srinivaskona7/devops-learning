# Loki — single-binary mode, local filesystem storage (kind/k3d dev environment)
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h   # 7 days
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    max_query_parallelism: 16
  query_scheduler:
    max_outstanding_requests_per_tenant: 2048
  frontend:
    max_outstanding_per_tenant: 4096

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 10Gi

# Disable components not needed in single-binary mode
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable Minio — use local storage
minio:
  enabled: false

# Push logs via Promtail sidecar (or OTel Collector's loki exporter)
gateway:
  enabled: false

# ServiceMonitor for Prometheus to scrape Loki
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prom-stack
  dashboards:
    enabled: true
    labels:
      grafana_dashboard: "1"
