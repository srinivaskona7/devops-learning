name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # create GitHub Release
  packages: write   # push to GHCR
  id-token: write   # cosign OIDC keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cicd-demo

jobs:
  release:
    name: Build, sign, and release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for release notes generation

      - name: Parse semver from tag
        id: semver
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v1.2.3
          MAJOR="${TAG%%.*}"                 # v1
          MINOR="${TAG%.*}"                  # v1.2
          echo "tag=${TAG}"       >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}"   >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}"   >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.semver.outputs.version }}
          cache-from: type=gha,scope=main-buildkit
          cache-to: type=gha,scope=main-buildkit,mode=max
          provenance: true
          sbom: true

      - name: Run Trivy scan (final gate before release notes)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign release image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Attach SBOM to release image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attach sbom --sbom sbom.spdx.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Generate release notes
        id: release_notes
        run: |
          # Get the previous tag for range
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "${{ steps.semver.outputs.tag }}" | head -1)
          if [ -z "${PREV_TAG}" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "## What's changed" > release_notes.md
          echo "" >> release_notes.md
          git log "${PREV_TAG}..${{ steps.semver.outputs.tag }}" \
            --pretty=format:"- %s (%h)" \
            --no-merges >> release_notes.md
          echo "" >> release_notes.md
          echo "## Container image" >> release_notes.md
          echo "" >> release_notes.md
          echo '```' >> release_notes.md
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.semver.outputs.tag }}" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Verify signature" >> release_notes.md
          echo "" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "cosign verify \\" >> release_notes.md
          echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \\" >> release_notes.md
          echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\" >> release_notes.md
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: Release ${{ steps.semver.outputs.tag }}
          body_path: release_notes.md
          files: sbom.spdx.json
          draft: false
          prerelease: false
