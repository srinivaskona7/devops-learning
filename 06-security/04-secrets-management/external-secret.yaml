---
# External Secrets Operator (ESO) — pulls from AWS Secrets Manager and
# materialises a native Kubernetes Secret. Refreshes every refreshInterval.
#
# Prereq: ESO installed (helm install external-secrets external-secrets/external-secrets)
# Prereq: IRSA/Workload Identity bound to the ESO controller SA, with
#         secretsmanager:GetSecretValue on the target ARN.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: app-restricted
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: db-creds                       # Secret name created in cluster
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Format the secret however the app needs it
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@{{ .host }}:5432/app"
  data:
    - secretKey: username
      remoteRef:
        key: prod/app/db                 # AWS SM secret name
        property: username               # JSON key inside the secret
    - secretKey: password
      remoteRef:
        key: prod/app/db
        property: password
    - secretKey: host
      remoteRef:
        key: prod/app/db
        property: host
