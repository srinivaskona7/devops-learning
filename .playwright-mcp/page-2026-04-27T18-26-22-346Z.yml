                    - /url: "#github-mcp-server"
                    - img [ref=e730]
                - paragraph [ref=e732]: The GitHub MCP Server connects AI tools directly to GitHub's platform. This gives AI agents, assistants, and chatbots the ability to read repositories and code files, manage issues and PRs, analyze code, and automate workflows. All through natural language interactions.
                - generic [ref=e733]:
                  - heading "Use Cases" [level=3] [ref=e734]
                  - 'link "Permalink: Use Cases" [ref=e735] [cursor=pointer]':
                    - /url: "#use-cases"
                    - img [ref=e736]
                - list [ref=e738]:
                  - listitem [ref=e739]: "Repository Management: Browse and query code, search files, analyze commits, and understand project structure across any repository you have access to."
                  - listitem [ref=e740]: "Issue & PR Automation: Create, update, and manage issues and pull requests. Let AI help triage bugs, review code changes, and maintain project boards."
                  - listitem [ref=e741]: "CI/CD & Workflow Intelligence: Monitor GitHub Actions workflow runs, analyze build failures, manage releases, and get insights into your development pipeline."
                  - listitem [ref=e742]: "Code Analysis: Examine security findings, review Dependabot alerts, understand code patterns, and get comprehensive insights into your codebase."
                  - listitem [ref=e743]: "Team Collaboration: Access discussions, manage notifications, analyze team activity, and streamline processes for your team."
                - paragraph [ref=e744]: Built for developers who want to connect their AI tools to GitHub context and capabilities, from simple natural language queries to complex multi-step agent workflows.
                - separator [ref=e745]
