                  - generic [ref=e1676]: docker run -i --rm \ -e GITHUB_PERSONAL_ACCESS_TOKEN=<your-token> \ -e GITHUB_READ_ONLY=1 \ ghcr.io/github/github-mcp-server
                  - button "Copy" [ref=e1678] [cursor=pointer]:
                    - img [ref=e1679]
                - generic [ref=e1682]:
                  - heading "Lockdown Mode" [level=2] [ref=e1683]
                  - 'link "Permalink: Lockdown Mode" [ref=e1684] [cursor=pointer]':
                    - /url: "#lockdown-mode"
                    - img [ref=e1685]
                - paragraph [ref=e1687]: Lockdown mode limits the content that the server will surface from public repositories. When enabled, the server checks whether the author of each item has push access to the repository. Private repositories are unaffected, and collaborators keep full access to their own content.
                - generic [ref=e1688]:
                  - generic [ref=e1689]: ./github-mcp-server --lockdown-mode
                  - button "Copy" [ref=e1691] [cursor=pointer]:
                    - img [ref=e1692]
                - paragraph [ref=e1695]: "When running with Docker, set the corresponding environment variable:"
                - generic [ref=e1696]:
                  - generic [ref=e1697]: docker run -i --rm \ -e GITHUB_PERSONAL_ACCESS_TOKEN=<your-token> \ -e GITHUB_LOCKDOWN_MODE=1 \ ghcr.io/github/github-mcp-server
                  - button "Copy" [ref=e1699] [cursor=pointer]:
                    - img [ref=e1700]
                - paragraph [ref=e1703]: The behavior of lockdown mode depends on the tool invoked.
