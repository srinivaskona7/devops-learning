            - generic [ref=e621]:
              - paragraph [ref=e622]: Containers have a local filesystem and you might be tempted to use it for persisting data.
              - paragraph [ref=e623]: However, storing persistent data in a container's local filesystem prevents the encompassing Pod from being scaled horizontally (that is, by adding or removing replicas of the Pod).
              - paragraph [ref=e624]: This is because, by using the local filesystem, each container maintains its own "state", which means that the states of Pod replicas may diverge over time. This results in inconsistent behaviour from the user's point of view (for example, a specific piece of user information is available when the request hits one Pod, but not when the request hits another Pod).
              - paragraph [ref=e625]: Instead, any persistent information should be saved at a central place outside the Pods. For example, in a PersistentVolume in the cluster, or even better in some storage service outside the cluster.
