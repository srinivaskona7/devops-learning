                    - text: .
                  - paragraph [ref=e597]: In active logging, the app makes network connections to intermediate aggregators, sends data to third-party logging services, or writes directly to a database or index.
                  - paragraph [ref=e598]: Active logging is considered an antipattern, and it should be avoided.
            - listitem [ref=e599]:
