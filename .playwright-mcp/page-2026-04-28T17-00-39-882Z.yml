            - listitem [ref=e640]:
              - generic [ref=e641]:
                - generic [ref=e642]:
                  - checkbox [ref=e643]
                  - paragraph [ref=e644]: Use the Horizontal Pod Autoscaler for apps with variable usage patterns
                  - button "Open" [ref=e646]
                - generic [ref=e648]:
                  - paragraph [ref=e649]:
                    - text: The
                    - link "Horizontal Pod Autoscaler (HPA)" [ref=e650] [cursor=pointer]:
                      - /url: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
                    - text: is a built-in Kubernetes feature that monitors your application and automatically adds or removes Pod replicas based on the current usage.
                  - paragraph [ref=e651]: Configuring the HPA allows your app to stay available and responsive under any traffic conditions, including unexpected spikes.
                  - paragraph [ref=e652]:
                    - text: To configure the HPA to autoscale your app, you have to create a
                    - link "HorizontalPodAutoscaler" [ref=e653] [cursor=pointer]:
                      - /url: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.16/#horizontalpodautoscaler-v1-autoscaling
                    - text: resource, which defines what metric to monitor for your app.
                  - paragraph [ref=e654]:
                    - text: The HPA can monitor either built-in resource metric (CPU and memory usage of your Pods) or custom metrics. In the case of custom metrics, you are also responsible for collecting and exposing these metrics, which you can do, for example, with
                    - link "Prometheus" [ref=e655] [cursor=pointer]:
                      - /url: https://prometheus.io/
                    - text: and the
                    - link "Prometheus Adapter" [ref=e656] [cursor=pointer]:
                      - /url: https://github.com/kubernetes-sigs/prometheus-adapter
                    - text: .
            - listitem [ref=e657]:
              - generic [ref=e658]:
                - generic [ref=e659]:
                  - checkbox [ref=e660]
                  - paragraph [ref=e661]: Don't use the Vertical Pod Autoscaler while it's still in beta
                  - button "Open" [ref=e663]
                - generic [ref=e665]:
                  - paragraph [ref=e666]:
                    - text: Analogous to the
                    - link "Horizontal Pod Autoscaler (HPA)" [ref=e667] [cursor=pointer]:
                      - /url: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
                    - text: ", there exists the"
                    - link "Vertical Pod Autoscaler (VPA)" [ref=e668] [cursor=pointer]:
                      - /url: https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
                    - text: .
                  - paragraph [ref=e669]:
                    - text: The VPA can automatically adapt the resource requests and limits of your Pods so that when a Pod needs more resources, it can get them (increasing/decreasing the resources of a single Pod is called
                    - emphasis [ref=e670]: vertical scaling
                    - text: ", as opposed to"
                    - emphasis [ref=e671]: horizontal scaling
                    - text: ", which means increasing/decreasing the number of replicas of a Pod)."
                  - paragraph [ref=e672]: This can be useful for scaling applications that can't be scaled horizontally.
                  - paragraph [ref=e673]:
                    - text: However, the VPA is curently in beta and it has
                    - link "some known limitations" [ref=e674] [cursor=pointer]:
                      - /url: https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler#limitations-of-beta-version
                    - text: (for example, scaling a Pod by changing its resource requirements, requires the Pod to be killed and restarted).
                  - paragraph [ref=e675]: Given these limitations, and the fact that most applications on Kubernetes can be scaled horizontally anyway, it is recommended to not use the VPA in production (at least until there is a stable version).
            - listitem [ref=e676]:
              - generic [ref=e677]:
                - generic [ref=e678]:
                  - checkbox [ref=e679]
                  - paragraph [ref=e680]: Use the Cluster Autoscaler if you have highly varying workloads
                  - button "Open" [ref=e682]
                - generic [ref=e684]:
                  - paragraph [ref=e685]:
                    - text: The
                    - link "Cluster Autoscaler" [ref=e686] [cursor=pointer]:
                      - /url: https://github.com/kubernetes/autoscaler/tree/master/cluster-autoscaler
                    - text: is another type of "autoscaler" (besides the
                    - link "Horizontal Pod Autoscaler" [ref=e687] [cursor=pointer]:
                      - /url: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
                    - text: and
                    - link "Vertical Pod Autoscaler" [ref=e688] [cursor=pointer]:
                      - /url: https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
                    - text: ).
                  - paragraph [ref=e689]: The Cluster Autoscaler can automatically scale the size of your cluster by adding or removing worker nodes.
                  - paragraph [ref=e690]: A scale-up operation happens when a Pod fails to be scheduled because of insufficient resources on the existing worker nodes. In this case, the Cluster Autoscaler creates a new worker node, so that the Pod can be scheduled. Similarly, when the utilisation of the existing worker nodes is low, the Cluster Autoscaler can scale down by evicting all the workloads from one of the worker nodes and removing it.
                  - paragraph [ref=e691]: Using the Cluster Autoscaler makes sense for highly variable workloads, for example, when the number of Pods may multiply in a short time, and then go back to the previous value. In such scenarios, the Cluster Autoscaler allows you to meet the demand spikes without wasting resources by overprovisioning worker nodes.
                  - paragraph [ref=e692]: However, if your workloads do not vary so much, it may not be worth to set up the Cluster Autoscaler, as it may never be triggered. If your workloads grow slowly and monotonically, it may be enough to monitor the utilisations of your existing worker nodes and add an additional worker node manually when they reach a critical value.
