                  - img "excalidraw-architect-mcp MCP server" [ref=e423]
                - paragraph [ref=e424]: It's been a constant struggle trying to understand unfamiliar and complex codebases - managing cognitive overload and trying to imagine how everything fits together.
                - generic [ref=e425]:
                  - heading "The Problem" [level=2] [ref=e426]
                  - 'link "Permalink: The Problem" [ref=e427] [cursor=pointer]':
                    - /url: "#the-problem"
                    - img [ref=e428]
                - paragraph [ref=e430]: When you're onboarding onto a codebase, designing a new system, or documenting existing architecture, a visual diagram communicates in seconds what pages of text can't. But the options today aren't great. Mermaid diagrams are quick to generate but have limited capabilities - you can't drag a node to reposition it, group components visually. Excalidraw solves these problems, but when LLMs try to generate Excalidraw directly, they hallucinate coordinates - boxes overlap, arrows tangle, and you end up fixing the diagram manually.
                - generic [ref=e431]:
                  - heading "The Solution" [level=2] [ref=e432]
                  - 'link "Permalink: The Solution" [ref=e433] [cursor=pointer]':
                    - /url: "#the-solution"
                    - img [ref=e434]
                - paragraph [ref=e436]:
                  - strong [ref=e437]: excalidraw-architect-mcp
                  - text: separates the
                  - emphasis [ref=e438]: what
                  - text: from the
                  - emphasis [ref=e439]: where
                  - text: "- the AI focuses on structure, the engine handles the pixel math."
                - paragraph [ref=e440]: Your LLM describes the components and connections, and the MCP handles layout, styling, and rendering using a proper graph layout algorithm. 50+ technologies (Kafka, PostgreSQL, Redis, etc.) get auto-styled, you can iteratively edit diagrams with natural language ("add a cache in front of the DB"), and it runs fully offline in Cursor/Windsurf - no API keys needed.
                - list [ref=e441]:
                  - listitem [ref=e442]:
                    - strong [ref=e443]: Perfect layouts every time
                    - text: "- Sugiyama algorithm with adaptive spacing; no overlapping boxes"
                  - listitem [ref=e444]:
                    - strong [ref=e445]: Architecture-aware styling
                    - text: "- say \"Kafka\" and get a stream-styled node, not a generic rectangle"
                  - listitem [ref=e446]:
                    - strong [ref=e447]: Talk to your diagrams
                    - text: "- add, remove, or rewire components on an existing diagram with natural language"
                  - listitem [ref=e448]:
                    - strong [ref=e449]: Hub node visualization
                    - text: "- gateways and load balancers auto-stretch to span their connected services"
                - generic [ref=e450]:
