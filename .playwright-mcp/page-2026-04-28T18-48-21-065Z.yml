    - main [ref=e315]:
      - generic [ref=e316]:
        - heading "Kubernetes Configuration Good Practices" [level=1] [ref=e317]
        - generic [ref=e318]:
          - text: By Kirti Goyal |
          - time [ref=e319]: Tuesday, November 25, 2025
        - paragraph [ref=e320]: Configuration is one of those things in Kubernetes that seems small until it's not. Configuration is at the heart of every Kubernetes workload. A missing quote, a wrong API version or a misplaced YAML indent can ruin your entire deploy.
        - paragraph [ref=e321]: This blog brings together tried-and-tested configuration best practices. The small habits that make your Kubernetes setup clean, consistent and easier to manage. Whether you are just starting out or already deploying apps daily, these are the little things that keep your cluster stable and your future self sane.
        - paragraph [ref=e322]:
          - emphasis [ref=e323]:
            - text: This blog is inspired by the original
            - emphasis [ref=e324]: Configuration Best Practices
            - text: page, which has evolved through contributions from many members of the Kubernetes community.
        - heading "General configuration practices" [level=2] [ref=e325]
        - heading "Use the latest stable API version" [level=3] [ref=e326]
        - paragraph [ref=e327]: Kubernetes evolves fast. Older APIs eventually get deprecated and stop working. So, whenever you are defining resources, make sure you are using the latest stable API version. You can always check with
        - code [ref=e330]:
          - generic [ref=e332]: kubectl api-resources
        - paragraph [ref=e333]: This simple step saves you from future compatibility issues.
        - heading "Store configuration in version control" [level=3] [ref=e334]
        - paragraph [ref=e335]: Never apply manifest files directly from your desktop. Always keep them in a version control system like Git, it's your safety net. If something breaks, you can instantly roll back to a previous commit, compare changes or recreate your cluster setup without panic.
        - heading "Write configs in YAML not JSON" [level=3] [ref=e336]
        - paragraph [ref=e337]: Write your configuration files using YAML rather than JSON. Both work technically, but YAML is just easier for humans. It's cleaner to read and less noisy and widely used in the community.
        - paragraph [ref=e338]:
          - text: "YAML has some sneaky gotchas with boolean values: Use only"
          - code [ref=e339]: "true"
          - text: or
          - code [ref=e340]: "false"
          - text: . Don't write
          - code [ref=e341]: "yes"
          - text: ","
          - code [ref=e342]: "no"
          - text: ","
          - code [ref=e343]: "on"
          - text: or
          - code [ref=e344]: "off"
          - text: . They might work in one version of YAML but break in another. To be safe, quote anything that looks like a Boolean (for example
          - code [ref=e345]: "\"yes\""
          - text: ).
        - heading "Keep configuration simple and minimal" [level=3] [ref=e346]
        - paragraph [ref=e347]: Avoid setting default values that are already handled by Kubernetes. Minimal manifests are easier to debug, cleaner to review and less likely to break things later.
        - heading "Group related objects together" [level=3] [ref=e348]
        - paragraph [ref=e349]:
          - text: If your Deployment, Service and ConfigMap all belong to one app, put them in a single manifest file.
          - text: It's easier to track changes and apply them as a unit. See the
          - link "Guestbook all-in-one.yaml" [ref=e350] [cursor=pointer]:
            - /url: https://github.com/kubernetes/examples/blob/master/web/guestbook/all-in-one/guestbook-all-in-one.yaml
          - text: file for an example of this syntax.
        - paragraph [ref=e351]: "You can even apply entire directories with:"
        - code [ref=e354]:
          - generic [ref=e356]: kubectl apply -f configs/
        - paragraph [ref=e357]: One command and boom everything in that folder gets deployed.
        - heading "Add helpful annotations" [level=3] [ref=e358]
        - paragraph [ref=e359]: Manifest files are not just for machines, they are for humans too. Use annotations to describe why something exists or what it does. A quick one-liner can save hours when debugging later and also allows better collaboration.
        - paragraph [ref=e360]:
          - text: The most helpful annotation to set is
          - code [ref=e361]: kubernetes.io/description
          - text: . It's like using comment, except that it gets copied into the API so that everyone else can see it even after you deploy.
        - 'heading "Managing Workloads: Pods, Deployments, and Jobs" [level=2] [ref=e362]'
        - paragraph [ref=e363]: A common early mistake in Kubernetes is creating Pods directly. Pods work, but they don't reschedule themselves if something goes wrong.
        - paragraph [ref=e364]:
          - emphasis [ref=e365]: Naked Pods
          - text: (Pods not managed by a controller, such as
          - link "Deployment" [ref=e366] [cursor=pointer]:
            - /url: /docs/concepts/workloads/controllers/deployment/
          - text: or a
          - link "StatefulSet" [ref=e367] [cursor=pointer]:
            - /url: /docs/concepts/workloads/controllers/statefulset/
          - text: ) are fine for testing, but in real setups, they are risky.
        - paragraph [ref=e368]: Why? Because if the node hosting that Pod dies, the Pod dies with it and Kubernetes won't bring it back automatically.
        - heading "Use Deployments for apps that should always be running" [level=3] [ref=e369]
        - paragraph [ref=e370]:
          - text: A Deployment, which both creates a ReplicaSet to ensure that the desired number of Pods is always available, and specifies a strategy to replace Pods (such as
          - link "RollingUpdate" [ref=e371] [cursor=pointer]:
            - /url: /docs/concepts/workloads/controllers/deployment/#rolling-update-deployment
          - text: ), is almost always preferable to creating Pods directly. You can roll out a new version, and if something breaks, roll back instantly.
        - heading "Use Jobs for tasks that should finish" [level=3] [ref=e372]
        - paragraph [ref=e373]:
          - text: A
          - link "Job" [ref=e374] [cursor=pointer]:
            - /url: /docs/concepts/workloads/controllers/job/
          - text: is perfect when you need something to run once and then stop like database migration or batch processing task. It will retry if the pods fails and report success when it's done.
        - heading "Service Configuration and Networking" [level=2] [ref=e375]
        - paragraph [ref=e376]: Services are how your workloads talk to each other inside (and sometimes outside) your cluster. Without them, your pods exist but can't reach anyone. Let's make sure that doesn't happen.
        - heading "Create Services before workloads that use them" [level=3] [ref=e377]
        - paragraph [ref=e378]:
          - text: When Kubernetes starts a Pod, it automatically injects environment variables for existing Services. So, if a Pod depends on a Service, create a
          - link "Service" [ref=e379] [cursor=pointer]:
            - /url: /docs/concepts/services-networking/service/
          - strong [ref=e380]: before
          - text: its corresponding backend workloads (Deployments or StatefulSets), and before any workloads that need to access it.
        - paragraph [ref=e381]: "For example, if a Service named foo exists, all containers will get the following variables in their initial environment:"
        - code [ref=e383]: FOO_SERVICE_HOST=<the host the Service runs on> FOO_SERVICE_PORT=<the port the Service runs on>
        - paragraph [ref=e384]: DNS based discovery doesn't have this problem, but it's a good habit to follow anyway.
        - heading "Use DNS for Service discovery" [level=3] [ref=e385]
        - paragraph [ref=e386]:
          - text: If your cluster has the DNS
          - link "add-on" [ref=e387] [cursor=pointer]:
            - /url: /docs/concepts/cluster-administration/addons/
          - text: "(most do), every Service automatically gets a DNS entry. That means you can access it by name instead of IP:"
        - code [ref=e390]:
          - generic [ref=e392]: curl http://my-service.default.svc.cluster.local
        - paragraph [ref=e393]: It's one of those features that makes Kubernetes networking feel magical.
        - heading "Avoid hostPort and hostNetwork unless absolutely necessary" [level=3] [ref=e394]:
          - text: Avoid
          - code [ref=e395]: hostPort
          - text: and
          - code [ref=e396]: hostNetwork
          - text: unless absolutely necessary
        - paragraph [ref=e397]: "You'll sometimes see these options in manifests:"
        - code [ref=e400]:
          - generic [ref=e402]: "hostPort: 8080"
          - generic [ref=e404]: "hostNetwork: true"
        - paragraph [ref=e405]:
          - text: "But here's the thing: They tie your Pods to specific nodes, making them harder to schedule and scale. Because each <"
          - code [ref=e406]: hostIP
          - text: ","
          - code [ref=e407]: hostPort
          - text: ","
          - code [ref=e408]: protocol
          - text: "> combination must be unique. If you don't specify the"
          - code [ref=e409]: hostIP
          - text: and
          - code [ref=e410]: protocol
          - text: explicitly, Kubernetes will use
          - code [ref=e411]: 0.0.0.0
          - text: as the default
          - code [ref=e412]: hostIP
          - text: and
          - code [ref=e413]: TCP
          - text: as the default
          - code [ref=e414]: protocol
          - text: . Unless you're debugging or building something like a network plugin, avoid them.
        - paragraph [ref=e415]:
          - text: If you just need local access for testing, try
          - link "kubectl port-forward" [ref=e416] [cursor=pointer]:
            - /url: /docs/reference/kubectl/generated/kubectl_port-forward/
            - code [ref=e417]: kubectl port-forward
          - text: ":"
        - code [ref=e420]:
          - generic [ref=e422]: kubectl port-forward deployment/web 8080:80
        - paragraph [ref=e423]:
          - text: See
          - link "Use Port Forwarding to access applications in a cluster" [ref=e424] [cursor=pointer]:
            - /url: /docs/tasks/access-application-cluster/port-forward-access-application-cluster/
          - text: to learn more. Or if you really need external access, use a
          - 'link "type: NodePort Service" [ref=e425] [cursor=pointer]':
            - /url: /docs/concepts/services-networking/service/#type-nodeport
            - code [ref=e426]: "type: NodePort"
            - text: Service
          - text: . That's the safer, Kubernetes-native way.
        - heading "Use headless Services for internal discovery" [level=3] [ref=e427]
        - paragraph [ref=e428]:
          - text: Sometimes, you don't want Kubernetes to load balance traffic. You want to talk directly to each Pod. That's where
          - link "headless Services" [ref=e429] [cursor=pointer]:
            - /url: /docs/concepts/services-networking/service/#headless-services
          - text: come in.
        - paragraph [ref=e430]:
          - text: You create one by setting
          - code [ref=e431]: "clusterIP: None"
          - text: . Instead of a single IP, DNS gives you a list of all Pods IPs, perfect for apps that manage connections themselves.
        - heading "Working with labels effectively" [level=2] [ref=e432]
        - paragraph [ref=e433]:
          - link "Labels" [ref=e434] [cursor=pointer]:
            - /url: /docs/concepts/overview/working-with-objects/labels/
          - text: are key/value pairs that are attached to objects such as Pods. Labels help you organize, query and group your resources. They don't do anything by themselves, but they make everything else from Services to Deployments work together smoothly.
        - heading "Use semantics labels" [level=3] [ref=e435]
        - paragraph [ref=e436]:
          - text: Good labels help you understand what's what, even after months later. Define and use
          - link "labels" [ref=e437] [cursor=pointer]:
            - /url: /docs/concepts/overview/working-with-objects/labels/
          - text: that identify semantic attributes of your application or Deployment. For example;
        - code [ref=e440]:
          - generic [ref=e442]: "labels:"
          - generic [ref=e444]: "app.kubernetes.io/name: myapp"
          - generic [ref=e446]: "app.kubernetes.io/component: web"
          - generic [ref=e448]: "tier: frontend"
          - generic [ref=e450]: "phase: test"
        - list [ref=e451]:
          - listitem [ref=e452]:
            - code [ref=e453]: app.kubernetes.io/name
            - text: ": what the app is"
          - listitem [ref=e454]:
            - code [ref=e455]: tier
            - text: ": which layer it belongs to (frontend/backend)"
          - listitem [ref=e456]:
            - code [ref=e457]: phase
            - text: ": which stage it's in (test/prod)"
        - paragraph [ref=e458]: "You can then use these labels to make powerful selectors. For example:"
        - code [ref=e461]:
          - generic [ref=e463]: kubectl get pods -l tier=frontend
        - paragraph [ref=e464]:
          - text: This will list all frontend Pods across your cluster, no matter which Deployment they came from. Basically you are not manually listing Pod names; you are just describing what you want. See the
          - link "guestbook" [ref=e465] [cursor=pointer]:
            - /url: https://github.com/kubernetes/examples/tree/master/web/guestbook/
          - text: app for examples of this approach.
        - heading "Use common Kubernetes labels" [level=3] [ref=e466]
        - paragraph [ref=e467]:
          - text: Kubernetes actually recommends a set of
          - link "common labels" [ref=e468] [cursor=pointer]:
            - /url: /docs/concepts/overview/working-with-objects/common-labels/
          - text: . It's a standardized way to name things across your different workloads or projects. Following this convention makes your manifests cleaner, and it means that tools such as
          - link "Headlamp" [ref=e469] [cursor=pointer]:
            - /url: https://headlamp.dev/
          - text: ","
          - link "dashboard" [ref=e470] [cursor=pointer]:
            - /url: https://github.com/kubernetes/dashboard#introduction
          - text: ", or third-party monitoring systems can all automatically understand what's running."
        - heading "Manipulate labels for debugging" [level=3] [ref=e471]
        - paragraph [ref=e472]: Since controllers (like ReplicaSets or Deployments) use labels to manage Pods, you can remove a label to “detach” a Pod temporarily.
        - paragraph [ref=e473]: "Example:"
        - code [ref=e476]:
          - generic [ref=e478]: kubectl label pod mypod app-
        - paragraph [ref=e479]:
          - text: The
          - code [ref=e480]: app-
          - text: part removes the label key
          - code [ref=e481]: app
          - text: . Once that happens, the controller won’t manage that Pod anymore. It’s like isolating it for inspection, a “quarantine mode” for debugging. To interactively remove or add labels, use
          - link "kubectl label" [ref=e482] [cursor=pointer]:
            - /url: /docs/reference/kubectl/generated/kubectl_label/
            - code [ref=e483]: kubectl label
          - text: .
        - paragraph [ref=e484]: You can then check logs, exec into it and once done, delete it manually. That’s a super underrated trick every Kubernetes engineer should know.
        - heading "Handy kubectl tips" [level=2] [ref=e485]
        - paragraph [ref=e486]: These small tips make life much easier when you are working with multiple manifest files or clusters.
        - heading "Apply entire directories" [level=3] [ref=e487]
        - paragraph [ref=e488]: "Instead of applying one file at a time, apply the whole folder:"
        - code [ref=e491]:
          - generic [ref=e493]: "# Using server-side apply is also a good practice"
          - generic [ref=e495]: kubectl apply -f configs/ --server-side
        - paragraph [ref=e496]:
          - text: This command looks for
          - code [ref=e497]: .yaml
          - text: ","
          - code [ref=e498]: .yml
          - text: and
          - code [ref=e499]: .json
          - text: files in that folder and applies them all together. It's faster, cleaner and helps keep things grouped by app.
        - heading "Use label selectors to get or delete resources" [level=3] [ref=e500]
        - paragraph [ref=e501]:
          - text: You don't always need to type out resource names one by one. Instead, use
          - link "selectors" [ref=e502] [cursor=pointer]:
            - /url: /docs/concepts/overview/working-with-objects/labels/#label-selectors
          - text: "to act on entire groups at once:"
        - code [ref=e505]:
          - generic [ref=e507]: kubectl get pods -l app=myapp
          - generic [ref=e509]: kubectl delete pod -l phase=test
        - paragraph [ref=e510]: It's especially useful in CI/CD pipelines, where you want to clean up test resources dynamically.
        - heading "Quickly create Deployments and Services" [level=3] [ref=e511]
        - paragraph [ref=e512]: "For quick experiments, you don't always need to write a manifest. You can spin up a Deployment right from the CLI:"
        - code [ref=e515]:
          - generic [ref=e517]: kubectl create deployment webapp --image=nginx
        - paragraph [ref=e518]: "Then expose it as a Service:"
        - code [ref=e521]:
          - generic [ref=e523]: kubectl expose deployment webapp --port=80
        - paragraph [ref=e524]:
          - text: This is great when you just want to test something before writing full manifests. Also, see
          - link "Use a Service to Access an Application in a cluster" [ref=e525] [cursor=pointer]:
            - /url: /docs/tasks/access-application-cluster/service-access-application-cluster/
          - text: for an example.
        - heading "Conclusion" [level=2] [ref=e526]
        - paragraph [ref=e527]: "Cleaner configuration leads to calmer cluster administrators. If you stick to a few simple habits: keep configuration simple and minimal, version-control everything, use consistent labels, and avoid relying on naked Pods, you'll save yourself hours of debugging down the road."
        - paragraph [ref=e528]: The best part? Clean configurations stay readable. Even after months, you or anyone on your team can glance at them and know exactly what’s happening.
        - list [ref=e529]:
          - listitem [ref=e530]:
            - 'link "Previous - Ingress NGINX Retirement: What You Need to Know" [ref=e531] [cursor=pointer]':
              - /url: /blog/2025/11/11/ingress-nginx-retirement/
              - text: ←Previous
          - listitem [ref=e532]:
            - link "Next - Kubernetes v1.35 Sneak Peek" [ref=e533] [cursor=pointer]:
              - /url: /blog/2025/11/26/kubernetes-v1-35-sneak-peek/
              - text: Next→
