{% if config.extra.comments_enabled %}
<h2 id="__comments">Comments</h2>
<script src="https://giscus.app/client.js"
        data-repo="your-org/Devops-learning"
        data-repo-id="REPLACE_WITH_REPO_ID"
        data-category="Q&A"
        data-category-id="REPLACE_WITH_CATEGORY_ID"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>

<script>
  // Re-render giscus on Material instant-nav theme switch.
  var palette = __md_get("__palette");
  if (palette && typeof palette.color === "object") {
    var theme = palette.color.scheme === "slate" ? "dark" : "light";
    var msg = { setConfig: { theme: theme } };
    var iframe = document.querySelector("iframe.giscus-frame");
    if (iframe) iframe.contentWindow.postMessage({ giscus: msg }, "https://giscus.app");
  }
</script>
{% endif %}
