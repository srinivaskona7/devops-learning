apiVersion: v1
kind: Secret
metadata:
  name: {{ include "three-tier.fullname" . }}-postgres
  labels: {{- include "three-tier.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "three-tier.fullname" . }}-postgres:{{ .Values.service.postgresPort }}/{{ .Values.postgres.database }}"
