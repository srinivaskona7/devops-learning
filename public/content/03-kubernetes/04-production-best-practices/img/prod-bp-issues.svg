<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="system-ui, sans-serif">
  <defs>
    <filter id="shadow-i" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Audit Findings -- 4 Quadrant View</text>
  <line x1="60" y1="48" x2="900" y2="48" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Grid lines -->
  <line x1="475" y1="60" x2="475" y2="670" stroke="currentColor" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="20" y1="360" x2="940" y2="360" stroke="currentColor" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ===== Q1: Typos & Grammar (Amber) — Top-Left ===== -->
  <rect x="24" y="64" width="440" height="288" rx="14" fill="#f59e0b" fill-opacity="0.06" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadow-i)"/>
  <rect x="24" y="64" width="440" height="34" rx="14" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="44" y="87" font-size="15" font-weight="700" fill="#b45309">Typos &amp; Grammar</text>
  <rect x="198" y="72" width="34" height="20" rx="10" fill="#f59e0b" fill-opacity="0.3"/>
  <text x="215" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">7</text>

  <text x="44" y="120" font-size="13" fill="#92400e"><tspan font-weight="600">1.</tspan> "Please <tspan text-decoration="line-through" fill="#dc2626">not</tspan> <tspan font-weight="600" fill="#16a34a">note</tspan>" <tspan fill="#b45309" font-size="11">x3 occurrences</tspan></text>
  <text x="44" y="144" font-size="13" fill="#92400e"><tspan font-weight="600">2.</tspan> "<tspan text-decoration="line-through" fill="#dc2626">curently</tspan> <tspan font-weight="600" fill="#16a34a">currently</tspan>"</text>
  <text x="44" y="168" font-size="13" fill="#92400e"><tspan font-weight="600">3.</tspan> "<tspan text-decoration="line-through" fill="#dc2626">appl</tspan> <tspan font-weight="600" fill="#16a34a">application</tspan>"</text>
  <text x="44" y="192" font-size="13" fill="#92400e"><tspan font-weight="600">4.</tspan> "<tspan text-decoration="line-through" fill="#dc2626">enviroment</tspan> <tspan font-weight="600" fill="#16a34a">environment</tspan>"</text>
  <text x="44" y="216" font-size="13" fill="#92400e"><tspan font-weight="600">5.</tspan> "<tspan text-decoration="line-through" fill="#dc2626">detail</tspan> <tspan font-weight="600" fill="#16a34a">detailed</tspan>"</text>
  <text x="44" y="240" font-size="13" fill="#92400e"><tspan font-weight="600">6.</tspan> "<tspan text-decoration="line-through" fill="#dc2626">controls</tspan> <tspan font-weight="600" fill="#16a34a">control</tspan>"</text>

  <!-- ===== Q2: Stale Content (Red) — Top-Right ===== -->
  <rect x="496" y="64" width="440" height="288" rx="14" fill="#dc2626" fill-opacity="0.06" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow-i)"/>
  <rect x="496" y="64" width="440" height="34" rx="14" fill="#dc2626" fill-opacity="0.15"/>
  <text x="516" y="87" font-size="15" font-weight="700" fill="#b91c1c">Stale Content</text>
  <rect x="636" y="72" width="34" height="20" rx="10" fill="#dc2626" fill-opacity="0.3"/>
  <text x="653" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">3</text>

  <rect x="516" y="108" width="400" height="48" rx="8" fill="#dc2626" fill-opacity="0.06" stroke="#dc2626" stroke-opacity="0.2" stroke-width="1"/>
  <text x="530" y="128" font-size="13" font-weight="600" fill="#991b1b">PodSecurityPolicy (PSP)</text>
  <text x="530" y="148" font-size="12" fill="#b91c1c">Removed in Kubernetes 1.25 -- still referenced as current</text>

  <rect x="516" y="166" width="400" height="48" rx="8" fill="#dc2626" fill-opacity="0.06" stroke="#dc2626" stroke-opacity="0.2" stroke-width="1"/>
  <text x="530" y="186" font-size="13" font-weight="600" fill="#991b1b">VPA (Vertical Pod Autoscaler)</text>
  <text x="530" y="206" font-size="12" fill="#b91c1c">Has been GA since 2023 -- page treats it as experimental</text>

  <rect x="516" y="224" width="400" height="48" rx="8" fill="#dc2626" fill-opacity="0.06" stroke="#dc2626" stroke-opacity="0.2" stroke-width="1"/>
  <text x="530" y="244" font-size="13" font-weight="600" fill="#991b1b">WhiteSource</text>
  <text x="530" y="264" font-size="12" fill="#b91c1c">Rebranded to Mend.io -- name is outdated</text>

  <!-- ===== Q3: Missing Topics (Indigo) — Bottom-Left ===== -->
  <rect x="24" y="368" width="440" height="296" rx="14" fill="#4f46e5" fill-opacity="0.06" stroke="#4f46e5" stroke-width="1.8" filter="url(#shadow-i)"/>
  <rect x="24" y="368" width="440" height="34" rx="14" fill="#4f46e5" fill-opacity="0.15"/>
  <text x="44" y="391" font-size="15" font-weight="700" fill="#4338ca">Missing Topics</text>
  <rect x="170" y="376" width="34" height="20" rx="10" fill="#4f46e5" fill-opacity="0.3"/>
  <text x="187" y="391" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">5</text>

  <circle cx="52" cy="424" r="6" fill="#4f46e5" fill-opacity="0.2" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="66" y="428" font-size="13" fill="#3730a3" font-weight="500">Container image scanning (Trivy, Grype, etc.)</text>

  <circle cx="52" cy="456" r="6" fill="#4f46e5" fill-opacity="0.2" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="66" y="460" font-size="13" fill="#3730a3" font-weight="500">Metrics &amp; distributed tracing (OTel)</text>

  <circle cx="52" cy="488" r="6" fill="#4f46e5" fill-opacity="0.2" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="66" y="492" font-size="13" fill="#3730a3" font-weight="500">GitOps workflows (Argo CD / Flux)</text>

  <circle cx="52" cy="520" r="6" fill="#4f46e5" fill-opacity="0.2" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="66" y="524" font-size="13" fill="#3730a3" font-weight="500">Service mesh (Istio / Linkerd)</text>

  <circle cx="52" cy="552" r="6" fill="#4f46e5" fill-opacity="0.2" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="66" y="556" font-size="13" fill="#3730a3" font-weight="500">No Kubernetes version specified (1.28+?)</text>

  <!-- ===== Q4: Incomplete Section 3 (Teal) — Bottom-Right ===== -->
  <rect x="496" y="368" width="440" height="296" rx="14" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488" stroke-width="1.8" filter="url(#shadow-i)"/>
  <rect x="496" y="368" width="440" height="34" rx="14" fill="#0d9488" fill-opacity="0.15"/>
  <text x="516" y="391" font-size="15" font-weight="700" fill="#0f766e">Incomplete Section 3</text>

  <!-- Bar chart -->
  <text x="540" y="432" font-size="12" font-weight="600" fill="#0f766e">Section coverage:</text>

  <rect x="540" y="444" width="300" height="22" rx="4" fill="#16a34a" fill-opacity="0.15"/>
  <rect x="540" y="444" width="300" height="22" rx="4" fill="#16a34a" fill-opacity="0.3"/>
  <text x="550" y="460" font-size="11" font-weight="600" fill="#166534">S1: 30 items</text>

  <rect x="540" y="474" width="160" height="22" rx="4" fill="#ea580c" fill-opacity="0.15"/>
  <rect x="540" y="474" width="160" height="22" rx="4" fill="#ea580c" fill-opacity="0.3"/>
  <text x="550" y="490" font-size="11" font-weight="600" fill="#9a3412">S2: 16 items</text>

  <rect x="540" y="504" width="90" height="22" rx="4" fill="#dc2626" fill-opacity="0.15"/>
  <rect x="540" y="504" width="90" height="22" rx="4" fill="#dc2626" fill-opacity="0.3"/>
  <text x="550" y="520" font-size="11" font-weight="600" fill="#991b1b">S3: 9 items</text>

  <text x="516" y="558" font-size="13" font-weight="600" fill="#0f766e">Missing from Section 3:</text>
  <text x="530" y="580" font-size="12" fill="#115e59">- etcd encryption at rest</text>
  <text x="530" y="600" font-size="12" fill="#115e59">- Audit policies &amp; audit logging</text>
  <text x="530" y="620" font-size="12" fill="#115e59">- Node hardening (CIS benchmarks)</text>
</svg>