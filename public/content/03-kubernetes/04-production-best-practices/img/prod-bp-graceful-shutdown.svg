<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 880" font-family="system-ui, sans-serif">
  <defs>
    <filter id="shadow-g" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-g" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="currentColor" fill-opacity="0.5"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Graceful Shutdown -- Sequence &amp; Race Condition</text>
  <line x1="60" y1="46" x2="880" y2="46" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ===== Sequence Flow ===== -->
  <!-- Step 1: kubectl delete -->
  <rect x="350" y="62" width="240" height="40" rx="20" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="1.8"/>
  <text x="470" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">kubectl delete pod</text>

  <!-- Arrow down -->
  <line x1="470" y1="102" x2="470" y2="128" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrow-g)"/>

  <!-- Step 2: API marks Terminating -->
  <rect x="310" y="132" width="320" height="40" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="470" y="157" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">API Server marks pod Terminating</text>

  <!-- Arrow down to fork -->
  <line x1="470" y1="172" x2="470" y2="196" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Fork indicator -->
  <circle cx="470" cy="200" r="5" fill="currentColor" fill-opacity="0.3"/>
  <text x="470" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor" fill-opacity="0.5">PARALLEL</text>

  <!-- Path A: Blue - Endpoint removal -->
  <line x1="470" y1="200" x2="230" y2="240" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="60" y="240" width="340" height="90" rx="12" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow-g)"/>
  <rect x="60" y="240" width="340" height="30" rx="12" fill="#2563eb" fill-opacity="0.15"/>
  <text x="80" y="261" font-size="13" font-weight="700" fill="#1d4ed8">Path A: Endpoint Removal</text>

  <text x="78" y="290" font-size="12" fill="#1e40af">1. kube-proxy watches Endpoints object</text>
  <text x="78" y="308" font-size="12" fill="#1e40af">2. Removes pod IP from iptables/IPVS rules</text>
  <text x="78" y="322" font-size="12" fill="#dc2626" font-weight="600">   (NOT instant -- propagation lag!)</text>

  <!-- Path B: Orange - SIGTERM -->
  <line x1="470" y1="200" x2="710" y2="240" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <rect x="540" y="240" width="340" height="90" rx="12" fill="#ea580c" fill-opacity="0.06" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow-g)"/>
  <rect x="540" y="240" width="340" height="30" rx="12" fill="#ea580c" fill-opacity="0.15"/>
  <text x="560" y="261" font-size="13" font-weight="700" fill="#c2410c">Path B: SIGTERM to PID 1</text>

  <text x="558" y="290" font-size="12" fill="#9a3412">1. Kubelet sends SIGTERM to container PID 1</text>
  <text x="558" y="308" font-size="12" fill="#9a3412">2. terminationGracePeriodSeconds countdown begins</text>
  <text x="558" y="322" font-size="12" fill="#9a3412">3. SIGKILL after timeout (default: 30s)</text>

  <!-- ===== RACE CONDITION Warning ===== -->
  <rect x="160" y="350" width="620" height="46" rx="12" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626" stroke-width="2"/>
  <rect x="160" y="350" width="80" height="46" rx="12" fill="#dc2626" fill-opacity="0.25"/>
  <text x="200" y="378" text-anchor="middle" font-size="11" font-weight="800" fill="#991b1b">RACE</text>
  <text x="470" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c">Traffic arrives AFTER SIGTERM -- kube-proxy lag causes dropped requests</text>

  <!-- ===== Two boxes: Correct vs Wrong ===== -->
  <!-- Correct Sequence (Green) -->
  <rect x="30" y="418" width="430" height="280" rx="14" fill="#16a34a" fill-opacity="0.06" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow-g)"/>
  <rect x="30" y="418" width="430" height="36" rx="14" fill="#16a34a" fill-opacity="0.15"/>
  <text x="60" y="442" font-size="15" font-weight="700" fill="#15803d">Correct Shutdown Sequence</text>

  <text x="50" y="478" font-size="13" fill="#166534"><tspan font-weight="700" fill="#16a34a">1.</tspan> Receive SIGTERM in application</text>
  <rect x="50" y="486" width="390" height="1" fill="#16a34a" fill-opacity="0.12"/>

  <text x="50" y="506" font-size="13" fill="#166534"><tspan font-weight="700" fill="#16a34a">2.</tspan> Stop accepting NEW connections</text>
  <rect x="50" y="514" width="390" height="1" fill="#16a34a" fill-opacity="0.12"/>

  <text x="50" y="534" font-size="13" fill="#166534"><tspan font-weight="700" fill="#16a34a">3.</tspan> Drain active / in-flight requests</text>
  <rect x="50" y="542" width="390" height="1" fill="#16a34a" fill-opacity="0.12"/>

  <text x="50" y="562" font-size="13" fill="#166534"><tspan font-weight="700" fill="#16a34a">4.</tspan> Close keepalive connections</text>
  <rect x="50" y="570" width="390" height="1" fill="#16a34a" fill-opacity="0.12"/>

  <text x="50" y="590" font-size="13" fill="#166534"><tspan font-weight="700" fill="#16a34a">5.</tspan> Exit process cleanly (code 0)</text>
  <rect x="50" y="598" width="390" height="1" fill="#16a34a" fill-opacity="0.12"/>

  <rect x="50" y="614" width="390" height="40" rx="8" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-opacity="0.3" stroke-width="1"/>
  <text x="60" y="634" font-size="12" font-weight="600" fill="#15803d">+ preStop hook: sleep 5-15s</text>
  <text x="60" y="648" font-size="11" fill="#166534" fill-opacity="0.8">(gives kube-proxy time to update rules)</text>

  <!-- Wrong Approaches (Red) -->
  <rect x="480" y="418" width="430" height="280" rx="14" fill="#dc2626" fill-opacity="0.06" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow-g)"/>
  <rect x="480" y="418" width="430" height="36" rx="14" fill="#dc2626" fill-opacity="0.15"/>
  <text x="510" y="442" font-size="15" font-weight="700" fill="#b91c1c">Wrong Approaches</text>

  <text x="500" y="478" font-size="13" fill="#991b1b"><tspan font-weight="600">Immediate exit on SIGTERM</tspan></text>
  <text x="500" y="496" font-size="12" fill="#b91c1c" fill-opacity="0.8">Drops all in-flight requests, users see errors</text>
  <rect x="500" y="504" width="390" height="1" fill="#dc2626" fill-opacity="0.12"/>

  <text x="500" y="524" font-size="13" fill="#991b1b"><tspan font-weight="600">Shell as PID 1 (CMD node app.js)</tspan></text>
  <text x="500" y="542" font-size="12" fill="#b91c1c" fill-opacity="0.8">Shell doesn't forward SIGTERM to child process</text>
  <rect x="500" y="550" width="390" height="1" fill="#dc2626" fill-opacity="0.12"/>

  <text x="500" y="570" font-size="13" fill="#991b1b"><tspan font-weight="600">Keepalive connections left open</tspan></text>
  <text x="500" y="588" font-size="12" fill="#b91c1c" fill-opacity="0.8">Load balancers keep sending traffic to dying pod</text>
  <rect x="500" y="596" width="390" height="1" fill="#dc2626" fill-opacity="0.12"/>

  <text x="500" y="616" font-size="13" fill="#991b1b"><tspan font-weight="600">No preStop hook</tspan></text>
  <text x="500" y="634" font-size="12" fill="#b91c1c" fill-opacity="0.8">No buffer for endpoint propagation -- race condition hits</text>

  <!-- ===== KEY INSIGHT Banner (Yellow) ===== -->
  <rect x="100" y="720" width="740" height="70" rx="14" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="2"/>
  <rect x="100" y="720" width="120" height="70" rx="14" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="160" y="758" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">KEY</text>
  <text x="160" y="774" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">INSIGHT</text>

  <text x="240" y="748" font-size="14" font-weight="600" fill="#92400e">Use exec form in Dockerfile:</text>
  <rect x="240" y="758" width="460" height="24" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>
  <text x="252" y="776" font-size="14" font-weight="600" fill="#16a34a">CMD ["node","app.js"]</text>
  <text x="460" y="776" font-size="14" font-weight="600" fill="currentColor" fill-opacity="0.5">NOT</text>
  <text x="500" y="776" font-size="14" font-weight="600" fill="#dc2626">CMD node app.js</text>
</svg>