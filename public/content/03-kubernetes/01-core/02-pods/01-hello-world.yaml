# Smallest possible pod — single container, GCR hello-app
apiVersion: v1
kind: Pod
metadata:
  name: hello-world
  labels:
    app: hello-world
    version: "1.0"
    component: demo
spec:
  restartPolicy: Always               # ← Always | OnFailure | Never
  containers:
    - name: hello
      image: gcr.io/google-samples/hello-app:1.0   # ← Google's canonical demo image
      ports:
        - name: http
          containerPort: 8080
      resources:
        requests:                     # ← scheduler uses these to pick a node
          cpu: "50m"
          memory: "64Mi"
        limits:                       # ← kernel kills container if exceeded
          cpu: "200m"
          memory: "128Mi"
      env:
        - name: GREETING
          value: "Hello from K8s"
