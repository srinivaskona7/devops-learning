---
# GREEN = candidate, image:2.0. No traffic until Service selector flips.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-green
  labels:
    app: hello-bg
    color: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-bg
      color: green
  template:
    metadata:
      labels:
        app: hello-bg
        color: green
        version: v2
    spec:
      containers:
        - name: hello
          image: gcr.io/google-samples/hello-app:2.0
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
