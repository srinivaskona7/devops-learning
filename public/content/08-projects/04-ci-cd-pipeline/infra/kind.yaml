kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Single-node cluster — sufficient for integration tests.
# Ephemeral: created and deleted within a single CI job.
nodes:
  - role: control-plane
    # Use a pinned image for reproducible builds.
    # Update this periodically: kind get images
    image: kindest/node:v1.30.0@sha256:047357ac0cfea04663786a612ba1eaba9702bef25227a794b52890dd8bcd692e

    # Port mappings allow the k6 smoke test to reach the NodePort service
    # without port-forwarding.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP

    # kubeadm configuration: reduce timeouts for faster CI
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

# Disable the default CNI so we can use the built-in kindnet.
# For integration tests, the default networking is sufficient.
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  disableDefaultCNI: false
