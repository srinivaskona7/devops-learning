apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-api
  labels:
    app: url-shortener-api
    app.kubernetes.io/name: url-shortener-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: url-shortener
  annotations:
    # Wave 0: apply after Namespace (wave -1) is created
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Base replica count — overlays override this via kustomize replicas patch
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never exceed 1 extra pod during rollout (keeps resource usage bounded)
      maxSurge: 1
      # Never go below 1 available pod (ensures zero-downtime)
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: url-shortener-api
        app.kubernetes.io/name: url-shortener-api
        app.kubernetes.io/version: "latest"
    spec:
      # Non-root security context — required by our Dockerfile USER directive
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000

      terminationGracePeriodSeconds: 30

      containers:
        - name: api
          # Image name without tag — kustomize overlays set newTag per environment
          image: url-shortener-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: PORT
              value: "8080"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: url-shortener-config
                  key: APP_ENV
            # DB credentials come from the Secret generated by ESO
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: url-shortener-db-creds
                  key: DATABASE_URL
                  optional: true  # allow startup without DB in dev (uses in-memory map)

          # Liveness: restart the pod if the process hangs
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          # Readiness: only send traffic when the pod is truly ready
          # Argo CD uses this to determine Healthy status during rollout
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2

          # Startup probe: give the JVM / Python startup time without
          # triggering a premature liveness kill
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 12
            periodSeconds: 5

          # Base resource requests/limits — overlays can patch these
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # Spread pods across zones for HA (applies to staging/prod where
      # multiple replicas exist; no-op for dev with 1 replica)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: url-shortener-api
