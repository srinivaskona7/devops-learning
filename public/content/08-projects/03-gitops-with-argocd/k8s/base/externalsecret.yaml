# ExternalSecret — url-shortener DB credentials
# ESO reads the secret value from a SecretStore (fake-vault for local dev,
# HashiCorp Vault / AWS SSM in production) and writes a native K8s Secret.
# The secret VALUE never appears in this file — only the reference path.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: url-shortener-db-creds
  labels:
    app.kubernetes.io/part-of: url-shortener
  annotations:
    # Wave -1: Secret must exist before the Deployment (wave 0) mounts it
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Refresh interval — ESO re-fetches from the store on each tick.
  # Short for dev; set to "1h" or "24h" in production.
  refreshInterval: 5m

  secretStoreRef:
    name: fake-vault-store
    kind: SecretStore     # cluster-scoped: use ClusterSecretStore in prod

  target:
    name: url-shortener-db-creds
    creationPolicy: Owner  # ESO owns the Secret; deleting ExternalSecret deletes Secret
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: url-shortener
      # Template constructs the final Secret key from fetched values
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres:5432/urldb?sslmode=disable"

  data:
    - secretKey: username
      remoteRef:
        key: url-shortener/db
        property: username
    - secretKey: password
      remoteRef:
        key: url-shortener/db
        property: password
---
# SecretStore — points to the fake-vault sidecar for local development.
# In production, replace with a Vault or AWS ParameterStore SecretStore.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: fake-vault-store
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    # fake-vault is a simple HTTP server that returns static JSON secrets.
    # It runs as a Deployment in the same namespace for local dev.
    webhook:
      url: "http://fake-vault.{{ .targetNamespace }}.svc.cluster.local:8200/secret/{{ .remoteRef.key }}"
      result:
        jsonPath: "$.data.{{ .remoteRef.property }}"
      headers:
        - name: X-Vault-Token
          value: dev-root-token
