apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml

# Common labels applied to every resource kustomize manages in this base
commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: url-shortener

# ConfigMap generated from literal values — overlays patch the APP_ENV key
configMapGenerator:
  - name: url-shortener-config
    literals:
      - APP_ENV=base
      - LOG_LEVEL=info
      - SHORT_DOMAIN=short.local
    options:
      # Disable the content-hash suffix so the name is stable across overlays
      disableNameSuffixHash: true
