# ═══════════════════════════════════════════════════════════════════════════════
# Prometheus Recording Rules — pre-compute expensive queries
#
# Pre-computing success_rate and p95 latency saves CPU at query time and makes
# AnalysisTemplate failureCondition thresholds instantaneous to evaluate.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app-recording-rules
  namespace: progressive
  labels:
    release: kps
spec:
  groups:
    # ── Success rate ─────────────────────────────────────────────────────────
    - name: demo-app.success-rate
      interval: 30s
      rules:
        # 2-minute rolling success rate per service.
        - record: job:http_requests:success_rate2m
          expr: |
            sum by (kubernetes_service_name) (
              rate(http_requests_total{code=~"2.."}[2m])
            )
            /
            sum by (kubernetes_service_name) (
              rate(http_requests_total[2m])
            )

        # Alert when canary success rate drops below 99% for 1 minute.
        - alert: CanaryHighErrorRate
          expr: |
            job:http_requests:success_rate2m{
              kubernetes_service_name="demo-app-canary"
            } < 0.99
          for: 1m
          labels:
            severity: warning
          annotations:
            summary:     "Canary error rate too high"
            description: "Canary success rate is {{ $value | humanizePercentage }} — below 99% SLO."

    # ── Latency ──────────────────────────────────────────────────────────────
    - name: demo-app.latency
      interval: 30s
      rules:
        # p95 latency per service.
        - record: job:http_request_duration_seconds:p95_2m
          expr: |
            histogram_quantile(0.95,
              sum by (le, kubernetes_service_name) (
                rate(http_request_duration_seconds_bucket[2m])
              )
            )

        # Alert when canary p95 exceeds 200ms.
        - alert: CanaryHighLatency
          expr: |
            job:http_request_duration_seconds:p95_2m{
              kubernetes_service_name="demo-app-canary"
            } > 0.200
          for: 1m
          labels:
            severity: warning
          annotations:
            summary:     "Canary p95 latency too high"
            description: "Canary p95 = {{ $value | humanizeDuration }} — exceeds 200ms SLO."

    # ── Traffic split health ─────────────────────────────────────────────────
    - name: demo-app.traffic
      interval: 30s
      rules:
        # Ratio of canary traffic vs total — mirrors Istio weight.
        - record: job:http_requests:canary_traffic_ratio2m
          expr: |
            sum(rate(http_requests_total{
              kubernetes_service_name="demo-app-canary"
            }[2m]))
            /
            (
              sum(rate(http_requests_total{
                kubernetes_service_name="demo-app-canary"
              }[2m]))
              +
              sum(rate(http_requests_total{
                kubernetes_service_name="demo-app-stable"
              }[2m]))
            )
