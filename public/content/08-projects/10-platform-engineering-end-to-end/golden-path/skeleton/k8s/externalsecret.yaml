---
# ExternalSecret — syncs a secret from Vault into a Kubernetes Secret
# The platform External Secrets Operator (ESO) controller reads from Vault
# and creates/updates the Kubernetes Secret automatically.
# Rotation interval: 1h (pod restart triggered by annotation hash change)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ${{values.name}}-secrets
  namespace: ${{values.team}}
  labels:
    app: ${{values.name}}
    team: ${{values.team}}
    platform.vantapay.io/secret-managed: "true"
  annotations:
    platform.vantapay.io/vault-path: "secret/${{values.name}}"
    platform.vantapay.io/rotation-interval: "1h"
spec:
  # How often ESO polls Vault for updates
  refreshInterval: 1h

  # Reference the platform SecretStore (cluster-scoped)
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend

  # The Kubernetes Secret that ESO will create/maintain
  target:
    name: ${{values.name}}-secrets
    creationPolicy: Owner    # ESO owns this secret; deleting ES deletes the K8s secret
    template:
      type: Opaque
      # Optional: transform secret values before storing
      # metadata:
      #   annotations:
      #     reloader.stakater.com/match: "true"   # triggers pod restart on change

  # Fields to sync from Vault KV secret
  data:
    - secretKey: DB_PASSWORD         # Kubernetes Secret key
      remoteRef:
        key: secret/${{values.name}} # Vault KV path
        property: db_password        # field within the Vault secret

    - secretKey: API_KEY
      remoteRef:
        key: secret/${{values.name}}
        property: api_key

    - secretKey: INTERNAL_JWT_SECRET
      remoteRef:
        key: secret/${{values.name}}
        property: jwt_secret
---
# ClusterSecretStore — platform-wide Vault backend
# Installed once by the platform team; all services reference this store.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    platform.vantapay.io/managed-by: platform-team
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          # ESO authenticates to Vault using the ServiceAccount token
          # Each service's SA is bound to a Vault policy via:
          #   vault write auth/kubernetes/role/<name> \
          #     bound_service_account_names=<name> \
          #     bound_service_account_namespaces=<team> \
          #     policies=<name>-policy
          role: ${{values.name}}
          serviceAccountRef:
            name: ${{values.name}}
