apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: platform-golden-path
  title: Platform Golden Path — New Service
  description: >
    Scaffold a production-ready microservice with all platform capabilities
    pre-wired: Argo Rollouts canary, Istio mTLS, Prometheus metrics, Loki logs,
    Tempo traces, Vault secrets, Kyverno-compliant manifests, and Chaos Mesh
    resilience tests. From this template to first production deploy in < 15 minutes.
  tags:
    - go
    - platform
    - golden-path
    - production-ready
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: vantapay/platform-gitops
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service Identity
      required:
        - name
        - team
        - description
      properties:
        name:
          title: Service name
          type: string
          description: "Lowercase, hyphenated. e.g. payment-processor"
          pattern: "^[a-z][a-z0-9-]{2,39}$"
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One sentence describing what this service does
        team:
          title: Owning team
          type: string
          description: Team slug for cost attribution and on-call routing
          enum:
            - payments
            - fraud
            - auth
            - platform
            - data
        system:
          title: Backstage system
          type: string
          description: Logical system this service belongs to
          default: vantapay-core

    - title: Platform Configuration
      required:
        - slo_tier
        - language
      properties:
        slo_tier:
          title: SLO tier
          type: string
          description: |
            bronze: 99.0% avail / p95 500ms (internal tools)
            silver: 99.5% avail / p95 300ms (partner-facing)
            gold:   99.9% avail / p95 150ms (customer-critical)
          enum: [bronze, silver, gold]
          default: silver
          ui:widget: select
        language:
          title: Service language
          type: string
          enum: [go, python, nodejs]
          default: go
        port:
          title: Service port
          type: number
          default: 8080
          minimum: 1024
          maximum: 65535
        replicas:
          title: Initial replica count
          type: number
          default: 3
          minimum: 2   # platform minimum for HA
          maximum: 20
        cpu_request:
          title: CPU request
          type: string
          default: "100m"
        cpu_limit:
          title: CPU limit
          type: string
          default: "500m"
        memory_request:
          title: Memory request
          type: string
          default: "128Mi"
        memory_limit:
          title: Memory limit
          type: string
          default: "512Mi"

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - vantapay

  steps:
    - id: fetch-template
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          team: ${{ parameters.team }}
          description: ${{ parameters.description }}
          slo_tier: ${{ parameters.slo_tier }}
          language: ${{ parameters.language }}
          port: ${{ parameters.port }}
          replicas: ${{ parameters.replicas }}
          cpu_request: ${{ parameters.cpu_request }}
          cpu_limit: ${{ parameters.cpu_limit }}
          memory_request: ${{ parameters.memory_request }}
          memory_limit: ${{ parameters.memory_limit }}
          system: ${{ parameters.system | default("vantapay-core") }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ["github.com"]
        description: "${{ parameters.description }}"
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private
        collaborators:
          - team: ${{ parameters.team }}
            access: push
          - team: platform-team
            access: admin
        topics:
          - platform-service
          - ${{ parameters.slo_tier }}-slo
          - ${{ parameters.language }}
        gitCommitMessage: "feat: scaffold ${{ parameters.name }} via platform golden path"

    - id: register-argocd
      name: Register in Argo CD
      action: http:backstage:request
      input:
        method: POST
        path: /api/proxy/argocd/api/v1/applications
        headers:
          content-type: application/json
        body:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ${{ parameters.name }}
            namespace: argocd
          spec:
            project: services
            source:
              repoURL: https://github.com/vantapay/${{ parameters.name }}
              targetRevision: main
              path: k8s
            destination:
              server: https://kubernetes.default.svc
              namespace: ${{ parameters.team }}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true

    - id: seed-vault
      name: Seed Vault secret path
      action: http:backstage:request
      input:
        method: POST
        path: /api/proxy/vault/v1/secret/data/${{ parameters.name }}
        headers:
          content-type: application/json
        body:
          data:
            placeholder: "REPLACE_ME"
            db_password: "REPLACE_ME"
            api_key: "REPLACE_ME"

    - id: register
      name: Register in Backstage catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Argo CD
        url: https://argocd.vantapay.io/applications/${{ parameters.name }}
      - title: Grafana Dashboard
        url: https://grafana.vantapay.io/d/platform-${{ parameters.name }}
      - title: Backstage catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
