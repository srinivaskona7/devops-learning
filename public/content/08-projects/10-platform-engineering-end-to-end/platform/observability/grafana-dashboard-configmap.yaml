apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"    # picked up by Grafana sidecar
    app: payment-service
    platform.vantapay.io/component: observability
  annotations:
    grafana-folder: "Services / Payments"
data:
  payment-service.json: |
    {
      "__inputs": [],
      "__requires": [
        { "type": "grafana", "id": "grafana", "name": "Grafana", "version": "10.0.0" },
        { "type": "datasource", "id": "prometheus", "name": "Prometheus", "version": "1.0.0" },
        { "type": "datasource", "id": "loki", "name": "Loki", "version": "1.0.0" },
        { "type": "datasource", "id": "tempo", "name": "Tempo", "version": "1.0.0" }
      ],
      "annotations": {
        "list": [
          {
            "name": "Deployments",
            "datasource": { "type": "prometheus" },
            "expr": "changes(kube_deployment_status_observed_generation{namespace=\"payment\",deployment=\"payment-service\"}[1m]) > 0",
            "iconColor": "blue",
            "titleFormat": "Deploy"
          },
          {
            "name": "Chaos Experiments",
            "datasource": { "type": "prometheus" },
            "expr": "chaos_mesh_experiment_status{namespace=\"payment\"} == 1",
            "iconColor": "red",
            "titleFormat": "Chaos: {{kind}}"
          }
        ]
      },
      "description": "Platform golden-path dashboard: RED metrics, SLO status, traces, logs",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "title": "SLO Status",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.995 },
                  { "color": "green", "value": 0.999 }
                ]
              },
              "unit": "percentunit",
              "min": 0.98,
              "max": 1
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "auto", "textMode": "auto", "colorMode": "background" },
          "targets": [
            {
              "expr": "job:slo_availability:ratio1h{job=\"payment-service\"}",
              "legendFormat": "Availability (1h)"
            }
          ],
          "title": "SLO Availability",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.1 },
                  { "color": "green", "value": 0.5 }
                ]
              },
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [
            {
              "expr": "1 - ((1 - job:slo_availability:ratio1h{job=\"payment-service\"}) / (1 - 0.999))",
              "legendFormat": "Error Budget Remaining"
            }
          ],
          "title": "Error Budget (gold 99.9%)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "title": "RED Metrics — Rate · Errors · Duration",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 6 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"payment-service\"}[5m])) by (status_code)",
              "legendFormat": "{{status_code}}"
            }
          ],
          "title": "Request Rate by Status",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.001 },
                  { "color": "red", "value": 0.005 }
                ]
              }
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 6 },
          "targets": [
            {
              "expr": "job:http_error_rate:rate5m{job=\"payment-service\"}",
              "legendFormat": "Error Rate"
            }
          ],
          "title": "Error Rate (5xx / total)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 6 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"payment-service\"}[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "job:http_request_duration_p95:5m{job=\"payment-service\"}",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"payment-service\"}[5m])) by (le))",
              "legendFormat": "p99"
            }
          ],
          "title": "Latency Percentiles",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "title": "Logs (Loki)",
          "type": "row"
        },
        {
          "datasource": { "type": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 15 },
          "options": {
            "dedupStrategy": "none",
            "showLabels": false,
            "showTime": true,
            "wrapLogMessage": true
          },
          "targets": [
            {
              "expr": "{namespace=\"payment\", app=\"payment-service\"} | json | level=~\"error|warn\"",
              "legendFormat": ""
            }
          ],
          "title": "Error & Warning Logs",
          "type": "logs"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "title": "Traces (Tempo)",
          "type": "row"
        },
        {
          "datasource": { "type": "tempo" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "targets": [
            {
              "queryType": "traceql",
              "query": "{ resource.service.name = \"payment-service\" && duration > 200ms }",
              "legendFormat": "Slow traces (>200ms)"
            }
          ],
          "title": "Slow Traces",
          "type": "traces"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 37,
      "tags": ["platform", "payment", "slo"],
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": { "type": "prometheus" },
            "definition": "label_values(kube_pod_labels{namespace=\"payment\"}, pod)",
            "name": "pod",
            "label": "Pod",
            "query": "label_values(kube_pod_labels{namespace=\"payment\"}, pod)",
            "refresh": 2,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "UTC",
      "title": "payment-service · Platform Dashboard",
      "uid": "platform-payment-service",
      "version": 1
    }
