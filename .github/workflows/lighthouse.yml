name: Lighthouse CI

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages (SPA + MkDocs)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://srinivaskona7.github.io/devops-learning' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compose URL list
        id: urls
        shell: bash
        run: |
          base="${SITE_URL%/}"
          {
            echo "urls<<EOF"
            echo "$base/"
            echo "$base/modules"
            echo "$base/modules/01-linux"
            echo "$base/modules/02-docker"
            echo "$base/docs/"
            echo "$base/docs/01-linux/"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.urls.outputs.urls }}
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: ignore
