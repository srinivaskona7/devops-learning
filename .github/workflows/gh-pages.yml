name: Deploy to GitHub Pages (SPA + MkDocs)

# Dual-surface deploy:
#   /  (repo root)           → Vite React SPA (interactive lab — Bento Grid)
#   /docs/                   → MkDocs Material (full reference — 15 modules, search, mermaid)
#
# Build order: MkDocs → Vite → merge into dist/ → actions/deploy-pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build SPA + MkDocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs site → mkdocs-build/
        # Non-strict + continue-on-error: a MkDocs warning must never block the
        # SPA (primary surface) from deploying. If this fails, /docs/ is skipped.
        continue-on-error: true
        run: mkdocs build --clean

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install SPA dependencies
        run: npm install

      - name: Build Vite SPA → dist/
        run: npm run build

      - name: Merge MkDocs output into dist/docs/
        run: |
          set -euo pipefail
          if [ ! -d dist ]; then
            echo "::error::dist directory missing — Vite build failed."
            exit 1
          fi
          # MkDocs is optional: if it built, mount it under /docs/; otherwise warn.
          if [ -d mkdocs-build ]; then
            mv mkdocs-build dist/docs
            echo "MkDocs merged into dist/docs/"
          else
            echo "::warning::mkdocs-build missing — deploying SPA only (/docs/ reference site skipped)."
          fi
          # .nojekyll so GH Pages serves files/dirs starting with underscore.
          touch dist/.nojekyll
          echo "=== dist/ tree (top level) ==="
          ls -la dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
