name: Deploy Platform to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'platform/**'
      - '*.md'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite React SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy module content to public folder
        run: |
          mkdir -p platform/public/content
          for module in 01-linux 02-docker 03-kubernetes 04-helm 05-monitoring 06-security 07-terraform 08-projects 09-interview-prep 10-scripting 11-devops-tools 12-golang 13-operators 14-policy-as-code 15-ai-for-devops; do
            if [ -d "$module" ]; then
              cp -r "$module" "platform/public/content/"
            fi
          done
        working-directory: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: platform/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
