apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-connection"
  labels:
    {{- include "hello-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -e
          echo "Testing http://{{ include "hello-app.fullname" . }}:{{ .Values.service.port }}/"
          wget -q -O- "http://{{ include "hello-app.fullname" . }}:{{ .Values.service.port }}/"
          echo "OK"
