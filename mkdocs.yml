site_name: DevOps Learning Lab
site_description: Learn-by-doing DevOps — Linux, Docker, Kubernetes, Helm, Monitoring, Security, Terraform
site_url: https://example.github.io/Devops-learning/
repo_url: https://github.com/example/Devops-learning
repo_name: Devops-learning
edit_uri: edit/main/

docs_dir: .
exclude_docs: |
  /node_modules/
  /.github/
  /docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra:
  comments_enabled: true
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for the feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks — please open an issue or PR to help improve it.

extra_css:
  - docs/stylesheets/extra.css

extra_javascript:
  - docs/javascripts/extra.js
  - docs/javascripts/progress.js
  - docs/javascripts/palette.js
  - docs/javascripts/killercoda.js
  - docs/javascripts/copy-yaml.js
  - docs/javascripts/pwa-register.js

plugins:
  - same-dir
  - search
  - mermaid2
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - docs/glossary.md
  - pymdownx.smartsymbols
  - pymdownx.details
  - pymdownx.emoji

nav:
  - Home: README.md
  - 01 Linux: 01-linux/README.md
  - 02 Docker: 02-docker/README.md
  - 03 Kubernetes:
      - Overview: 03-kubernetes/README.md
      - Core: 03-kubernetes/01-core/README.md
      - Strategies: 03-kubernetes/02-strategies/README.md
      - Advanced: 03-kubernetes/03-advanced/README.md
  - 04 Helm: 04-helm/README.md
  - 05 Monitoring: 05-monitoring/README.md
  - 06 Security: 06-security/README.md
  - 07 Terraform: 07-terraform/README.md
  - 08 Projects: 08-projects/README.md
  - Glossary: docs/glossary.md
