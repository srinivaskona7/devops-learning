site_name: DevOps Learning Lab
site_description: Learn-by-doing DevOps — Linux, Docker, Kubernetes, Helm, Monitoring, Security, Terraform
site_url: https://example.github.io/Devops-learning/
repo_url: https://github.com/example/Devops-learning
repo_name: Devops-learning
edit_uri: edit/main/

docs_dir: .
exclude_docs: |
  /node_modules/
  /.github/
  /docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra:
  comments_enabled: true
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for the feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks — please open an issue or PR to help improve it.

extra_css:
  - docs/stylesheets/extra.css

extra_javascript:
  - docs/javascripts/extra.js
  - docs/javascripts/progress.js
  - docs/javascripts/palette.js
  - docs/javascripts/killercoda.js
  - docs/javascripts/copy-yaml.js
  - docs/javascripts/pwa-register.js

plugins:
  - same-dir
  - search
  - mermaid2
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - docs/glossary.md
  - pymdownx.smartsymbols
  - pymdownx.details
  - pymdownx.emoji

nav:
  - Home: README.md

  - Foundations:
      - 01 Linux:
          - Overview: 01-linux/README.md
          - Commands: 01-linux/commands.md
      - 02 Docker:
          - Overview: 02-docker/README.md
          - Commands: 02-docker/commands.md

  - Kubernetes:
      - 03 Core:
          - Overview: 03-kubernetes/01-core/README.md
          - Commands: 03-kubernetes/01-core/commands.md
      - 03 Strategies:
          - Overview: 03-kubernetes/02-strategies/README.md
          - Commands: 03-kubernetes/02-strategies/commands.md
      - 03 Advanced:
          - Overview: 03-kubernetes/03-advanced/README.md
          - Commands: 03-kubernetes/03-advanced/commands.md

  - Platform:
      - 04 Helm:
          - Overview: 04-helm/README.md
          - Commands: 04-helm/commands.md
      - 05 Monitoring:
          - Overview: 05-monitoring/README.md
          - Commands: 05-monitoring/commands.md
      - 06 Security:
          - Overview: 06-security/README.md
          - Commands: 06-security/commands.md
      - 07 Terraform:
          - Overview: 07-terraform/README.md
          - Commands: 07-terraform/commands.md

  - Projects:
      - Overview: 08-projects/README.md
      - P01 · Hello World Docker: 08-projects/01-hello-world-end-to-end/README.md
      - P02 · Three-Tier App: 08-projects/02-three-tier-app/README.md
      - P03 · GitOps with Argo CD: 08-projects/03-gitops-with-argocd/README.md
      - P04 · CI/CD Pipeline: 08-projects/04-ci-cd-pipeline/README.md
      - P05 · Observability Stack: 08-projects/05-observability-stack/README.md
      - P06 · Prod EKS on AWS: 08-projects/06-prod-grade-cluster-on-aws/README.md
      - P07 · Disaster Recovery: 08-projects/07-disaster-recovery/README.md
      - P08 · Security Hardening: 08-projects/08-security-hardening-lab/README.md
      - P09 · Zero-Downtime Delivery: 08-projects/09-zero-downtime-progressive-delivery/README.md
      - P10 · Platform Engineering: 08-projects/10-platform-engineering-end-to-end/README.md

  - Interview Prep:
      - Overview: 09-interview-prep/README.md

  - Glossary: docs/glossary.md
