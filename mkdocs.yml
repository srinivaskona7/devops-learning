site_name: DevOps Learning Lab
site_description: Learn-by-doing DevOps — Linux, Docker, Kubernetes, Helm, Monitoring, Security, Terraform
site_url: https://example.github.io/Devops-learning/
repo_url: https://github.com/example/Devops-learning
repo_name: Devops-learning
edit_uri: edit/main/

docs_dir: .
exclude_docs: |
  /node_modules/
  /.github/
  /docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Cyberpunk Mode (Default)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: High Contrast Mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

extra:
  comments_enabled: true
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for the feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks — please open an issue or PR to help improve it.

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/progress.js
  - javascripts/palette.js
  - javascripts/killercoda.js
  - javascripts/copy-yaml.js
  - javascripts/pwa-register.js

plugins:
  - same-dir
  - search
  - mermaid2
  - kroki:
      ServerURL: !ENV [KROKI_SERVER_URL, 'https://kroki.io']
      EnableBlockDiag: false
      Enablebpmn: false
      EnableExcalidraw: true
      EnableMermaid: false
      EnableDiagramsnet: false
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - docs/glossary.md
  - pymdownx.smartsymbols
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

