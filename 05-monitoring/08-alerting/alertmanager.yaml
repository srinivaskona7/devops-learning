global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@example.com'
  slack_api_url: 'https://hooks.slack.com/services/T000/B000/XXXX'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: slack-default
  group_by: [alertname, cluster, namespace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Page on critical
    - matchers:
        - severity = "critical"
      receiver: pagerduty
      continue: true

    # Database team
    - matchers:
        - team = "data"
      receiver: slack-data
      group_by: [alertname, cluster, namespace, db]

    # Silence noisy info during business hours? Use silences in UI; do not bake into config.
    - matchers:
        - severity = "info"
      receiver: 'null'

    # Catch-all warnings
    - matchers:
        - severity = "warning"
      receiver: slack-default

inhibit_rules:
  # If the whole node is down, don't page about its pods
  - source_matchers: [alertname = "NodeDown"]
    target_matchers: [alertname =~ "PodNotReady|PodCrashLooping"]
    equal: [node]

  # If cluster is in maintenance, suppress warnings
  - source_matchers: [alertname = "ClusterInMaintenance"]
    target_matchers: [severity = "warning"]
    equal: [cluster]

receivers:
  - name: 'null'

  - name: slack-default
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts -}}
          *Severity:* {{ .Labels.severity }}
          *Cluster:*  {{ .Labels.cluster }}
          *Namespace:* {{ .Labels.namespace }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}

  - name: slack-data
    slack_configs:
      - channel: '#data-alerts'
        send_resolved: true

  - name: pagerduty
    pagerduty_configs:
      - service_key: 'REPLACE_WITH_INTEGRATION_KEY'
        severity: '{{ .CommonLabels.severity }}'
        description: '{{ .CommonLabels.alertname }} on {{ .CommonLabels.cluster }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          summary: '{{ .CommonAnnotations.summary }}'

  - name: email-ops
    email_configs:
      - to: 'ops@example.com'
        send_resolved: true
