# Opaque secret — use stringData for human-readable input (auto base64-encoded)
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    app: demo
type: Opaque
stringData:                        # ← plaintext input; auto-encoded to data.* on apply
  username: "appuser"
  password: "s3cr3t-rotate-me"
  db-password: "s3cr3t-rotate-me"  # ← mounted as a file in the demo pod
