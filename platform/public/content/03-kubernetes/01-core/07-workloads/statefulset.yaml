# StatefulSet: ordered, stable network IDs, per-pod PVC
apiVersion: v1
kind: Service
metadata:
  name: zk
  labels:
    app: zk
spec:
  clusterIP: None
  selector: { app: zk }
  ports:
    - port: 2181
      name: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zk
  labels:
    app: zk
    component: coordinator
spec:
  serviceName: zk
  replicas: 3
  selector:
    matchLabels: { app: zk }
  template:
    metadata:
      labels:
        app: zk
        component: coordinator
    spec:
      containers:
        - name: zk
          image: nginx:1.27-alpine            # ← stand-in; replace with real ZK
          ports:
            - containerPort: 2181
              name: client
          volumeMounts:
            - name: data
              mountPath: /var/data
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
