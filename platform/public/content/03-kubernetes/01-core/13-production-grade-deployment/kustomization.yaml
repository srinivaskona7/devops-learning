apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# common labels applied to every resource
commonLabels:
  app: hello-prod
  app.kubernetes.io/name: hello-prod
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml

