# Multi-node kind cluster — 1 control-plane + 2 workers
# Apply: kind create cluster --config kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-learning
nodes:
  - role: control-plane
    # Port mappings let ingress-nginx work on host localhost
    extraPortMappings:
      - containerPort: 80     # ← HTTP for ingress
        hostPort: 80
        protocol: TCP
      - containerPort: 443    # ← HTTPS for ingress
        hostPort: 443
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"   # ← needed for ingress-nginx
  - role: worker
  - role: worker
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
