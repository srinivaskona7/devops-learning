---
# CANARY: 1 replica of v2 -> ~10% of traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-canary
  labels:
    app: hello-canary-app
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-canary-app
      track: canary
  template:
    metadata:
      labels:
        app: hello-canary-app
        track: canary
        version: v2
    spec:
      containers:
        - name: hello
          image: gcr.io/google-samples/hello-app:2.0
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
