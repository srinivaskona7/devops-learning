<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" font-family="system-ui, sans-serif">
  <defs>
    <filter id="shadow-h" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-h" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="currentColor" fill-opacity="0.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Health Checks -- Flow &amp; Comparison</text>
  <line x1="60" y1="46" x2="860" y2="46" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ===== Flow: Pod Starts ===== -->
  <rect x="370" y="64" width="180" height="42" rx="21" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="1.8"/>
  <text x="460" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Pod Starts</text>

  <!-- Arrow down -->
  <line x1="460" y1="106" x2="460" y2="134" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrow-h)"/>

  <!-- Diamond: Has Readiness Probe? -->
  <polygon points="460,140 570,185 460,230 350,185" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="460" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Has Readiness</text>
  <text x="460" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Probe?</text>

  <!-- YES branch (left) -->
  <line x1="350" y1="185" x2="260" y2="185" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-h)"/>
  <text x="300" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">YES</text>
  <rect x="80" y="164" width="180" height="42" rx="10" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow-h)"/>
  <text x="170" y="183" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Kubelet gates</text>
  <text x="170" y="199" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">traffic correctly</text>

  <!-- NO branch (right) -->
  <line x1="570" y1="185" x2="660" y2="185" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-h)"/>
  <text x="615" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">NO</text>
  <rect x="660" y="164" width="190" height="42" rx="10" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow-h)"/>
  <text x="755" y="183" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">2 min of 500 errors</text>
  <text x="755" y="199" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">to real users</text>

  <!-- ===== Three Probe Boxes ===== -->
  <!-- Readiness Probe (Blue) -->
  <rect x="30" y="270" width="270" height="200" rx="12" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow-h)"/>
  <rect x="30" y="270" width="270" height="34" rx="12" fill="#2563eb" fill-opacity="0.15"/>
  <text x="165" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Readiness Probe</text>

  <text x="48" y="326" font-size="12" fill="#1e40af" font-weight="500">Purpose: Gate traffic to pod</text>
  <line x1="48" y1="334" x2="280" y2="334" stroke="#2563eb" stroke-opacity="0.12" stroke-width="1"/>
  <text x="48" y="354" font-size="12" fill="#1e40af" font-weight="500">Must be independent</text>
  <line x1="48" y1="362" x2="280" y2="362" stroke="#2563eb" stroke-opacity="0.12" stroke-width="1"/>
  <text x="48" y="382" font-size="12" fill="#1e40af" font-weight="500">No database dependencies!</text>
  <line x1="48" y1="390" x2="280" y2="390" stroke="#2563eb" stroke-opacity="0.12" stroke-width="1"/>
  <text x="48" y="410" font-size="12" fill="#1e40af" font-weight="500">Check app can serve requests</text>
  <line x1="48" y1="418" x2="280" y2="418" stroke="#2563eb" stroke-opacity="0.12" stroke-width="1"/>
  <text x="48" y="438" font-size="12" fill="#1e40af" font-weight="500">Removed from endpoints on fail</text>

  <!-- Liveness Probe (Orange) -->
  <rect x="325" y="270" width="270" height="200" rx="12" fill="#ea580c" fill-opacity="0.06" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow-h)"/>
  <rect x="325" y="270" width="270" height="34" rx="12" fill="#ea580c" fill-opacity="0.15"/>
  <text x="460" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">Liveness Probe</text>

  <text x="343" y="326" font-size="12" fill="#9a3412" font-weight="500">Purpose: Restart stuck pods</text>
  <line x1="343" y1="334" x2="575" y2="334" stroke="#ea580c" stroke-opacity="0.12" stroke-width="1"/>
  <text x="343" y="354" font-size="12" fill="#9a3412" font-weight="500">Passive /healthz endpoint</text>
  <line x1="343" y1="362" x2="575" y2="362" stroke="#ea580c" stroke-opacity="0.12" stroke-width="1"/>
  <text x="343" y="382" font-size="12" fill="#9a3412" font-weight="500">Should always return 200</text>
  <line x1="343" y1="390" x2="575" y2="390" stroke="#ea580c" stroke-opacity="0.12" stroke-width="1"/>
  <text x="343" y="410" font-size="12" fill="#9a3412" font-weight="500">Only for deadlock detection</text>
  <line x1="343" y1="418" x2="575" y2="418" stroke="#ea580c" stroke-opacity="0.12" stroke-width="1"/>
  <text x="343" y="438" font-size="12" fill="#9a3412" font-weight="500">Pod is killed + restarted on fail</text>

  <!-- Startup Probe (Purple) -->
  <rect x="620" y="270" width="270" height="200" rx="12" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow-h)"/>
  <rect x="620" y="270" width="270" height="34" rx="12" fill="#7c3aed" fill-opacity="0.15"/>
  <text x="755" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">Startup Probe</text>

  <text x="638" y="326" font-size="12" fill="#5b21b6" font-weight="500">Purpose: Slow-starting apps</text>
  <line x1="638" y1="334" x2="870" y2="334" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1"/>
  <text x="638" y="354" font-size="12" fill="#5b21b6" font-weight="500">Delays liveness probe start</text>
  <line x1="638" y1="362" x2="870" y2="362" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1"/>
  <text x="638" y="382" font-size="12" fill="#5b21b6" font-weight="500">For apps with long init (JVM, etc.)</text>
  <line x1="638" y1="390" x2="870" y2="390" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1"/>
  <text x="638" y="410" font-size="12" fill="#5b21b6" font-weight="500">Avoids premature kill</text>
  <line x1="638" y1="418" x2="870" y2="418" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Not covered deeply badge -->
  <rect x="648" y="432" width="230" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="763" y="449" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">Not covered deeply on page</text>

  <!-- ===== CRITICAL Banner ===== -->
  <rect x="60" y="500" width="800" height="50" rx="12" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626" stroke-width="2"/>
  <rect x="60" y="500" width="110" height="50" rx="12" fill="#dc2626" fill-opacity="0.2"/>
  <text x="115" y="530" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">CRITICAL</text>
  <text x="480" y="530" text-anchor="middle" font-size="15" font-weight="600" fill="#b91c1c">Never point both readiness and liveness probes to the same endpoint!</text>

  <!-- Explanatory note -->
  <rect x="60" y="566" width="800" height="60" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.1" stroke-width="1"/>
  <text x="80" y="590" font-size="13" fill="currentColor" fill-opacity="0.7">If both probes share an endpoint and it fails, liveness kills the pod while readiness would have just removed it</text>
  <text x="80" y="610" font-size="13" fill="currentColor" fill-opacity="0.7">from the service. This causes unnecessary restarts and potential cascading failures across the cluster.</text>
</svg>