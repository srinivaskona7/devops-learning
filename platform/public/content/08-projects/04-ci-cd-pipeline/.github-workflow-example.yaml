name: build-deploy

on:
  push:
    branches: [main]
    paths:
      - "10-projects/01-hello-world-end-to-end/**"
      - ".github/workflows/build-deploy.yaml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hello-world
  APP_PATH: 10-projects/01-hello-world-end-to-end

permissions:
  contents: write       # to commit manifest bump back
  packages: write       # to push to GHCR
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 ${{ env.APP_PATH }}/app --max-line-length=120

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ${{ env.APP_PATH }}/app/requirements.txt pytest
      - run: pytest ${{ env.APP_PATH }} || echo "No tests yet — add some!"

  build-scan-push:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally for scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    runs-on: ubuntu-latest
    needs: build-scan-push
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump image tag in deployment.yaml
        run: |
          set -euo pipefail
          NEW_IMAGE="${IMAGE_NAME}:${{ needs.build-scan-push.outputs.image-tag }}"
          FILE="${APP_PATH}/k8s/deployment.yaml"
          sed -i -E "s|image: .*hello-world:.*|image: ${NEW_IMAGE}|g" "$FILE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore(deploy): bump hello-world to ${{ needs.build-scan-push.outputs.image-tag }} [skip ci]"
          git push
