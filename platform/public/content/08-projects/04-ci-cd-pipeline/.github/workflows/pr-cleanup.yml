name: PR Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup:
    name: Remove preview environment
    runs-on: ubuntu-latest
    environment:
      name: preview-pr-${{ github.event.number }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure preview kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "${PREVIEW_KUBECONFIG}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Delete preview namespace
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          chmod +x infra/preview/cleanup.sh
          infra/preview/cleanup.sh "${PR_NUMBER}"

      - name: Post cleanup confirmation comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const merged = context.payload.pull_request.merged;
            const reason = merged ? 'merged' : 'closed';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: [
                '## Preview environment removed',
                '',
                `PR was ${reason}. Preview namespace \`pr-${pr}\` has been deleted.`,
              ].join('\n'),
            });

      - name: Delete GitHub environment
        uses: strumwolf/delete-deployment-environment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: preview-pr-${{ github.event.number }}
          onlyRemoveDeployments: false
