---
# OPA Gatekeeper equivalent — disallow images from unapproved registries.
#
# Two CRDs:
#   1. ConstraintTemplate — defines the Rego rule + the schema for params
#   2. <Kind>Constraint    — instantiates the template with parameters & match
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedrepos
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRepos
      validation:
        openAPIV3Schema:
          type: object
          properties:
            repos:
              type: array
              items: { type: string }
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedrepos

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not startswith_any(container.image, input.parameters.repos)
          msg := sprintf("container <%v> uses image from disallowed registry: %v",
                         [container.name, container.image])
        }

        startswith_any(s, prefixes) {
          startswith(s, prefixes[_])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: only-trusted-registries
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
  parameters:
    repos:
      - "ghcr.io/myorg/"
      - "registry.example.com/"
      - "gcr.io/distroless/"
