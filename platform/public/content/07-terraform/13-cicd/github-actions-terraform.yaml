name: Terraform

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:

# Only one TF run per env at a time.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write    # OIDC to AWS/GCP
  contents: read
  pull-requests: write   # post plan comment

env:
  TF_VERSION: 1.9.8
  AWS_REGION: eu-west-1
  WORKING_DIR: infra/envs/dev

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: AWS auth via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111111111111:role/github-terraform-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform fmt
        run: terraform fmt -recursive -check

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --no-color
        working-directory: ${{ env.WORKING_DIR }}

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIR }}

      - name: terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan | tee plan.txt
          terraform show -no-color tfplan > plan-readable.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan-readable.txt', 'utf8');
            const body = '### Terraform Plan\n```hcl\n' + plan.slice(0, 60000) + '\n```';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan
