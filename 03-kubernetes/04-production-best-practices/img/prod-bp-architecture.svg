  <text x="280" y="224" text-anchor="end" font-size="12" fill="#16a34a" font-weight="500">(6)</text>
  <rect x="36" y="230" width="268" height="1" fill="#16a34a" fill-opacity="0.15"/>

  <text x="36" y="250" font-size="13" font-weight="600" fill="#166534">Tagging</text>
  <text x="280" y="250" text-anchor="end" font-size="12" fill="#16a34a" font-weight="500">(3)</text>
  <rect x="36" y="256" width="268" height="1" fill="#16a34a" fill-opacity="0.15"/>

