  <rect x="640" y="62" width="300" height="570" rx="12" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow-a)"/>
  <rect x="640" y="62" width="300" height="36" rx="12" fill="#2563eb" fill-opacity="0.18"/>
  <text x="790" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Section 3: Cluster Config</text>
