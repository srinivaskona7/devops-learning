  <text x="270" y="87" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">30 items</text>

  <!-- Items -->
  <text x="36" y="120" font-size="13" font-weight="600" fill="#166534">Health Checks</text>
  <text x="280" y="120" text-anchor="end" font-size="12" fill="#16a34a" font-weight="500">(4)</text>
  <rect x="36" y="126" width="268" height="1" fill="#16a34a" fill-opacity="0.15"/>

  <text x="36" y="146" font-size="13" font-weight="600" fill="#166534">Apps Independent</text>
  <text x="280" y="146" text-anchor="end" font-size="12" fill="#16a34a" font-weight="500">(2)</text>
  <rect x="36" y="152" width="268" height="1" fill="#16a34a" fill-opacity="0.15"/>

  <text x="36" y="172" font-size="13" font-weight="600" fill="#166534">Graceful Shutdown</text>
  <text x="280" y="172" text-anchor="end" font-size="12" fill="#16a34a" font-weight="500">(4)</text>
  <rect x="36" y="178" width="268" height="1" fill="#16a34a" fill-opacity="0.15"/>

