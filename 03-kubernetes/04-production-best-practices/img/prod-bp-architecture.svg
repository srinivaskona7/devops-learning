<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="system-ui, sans-serif">
  <defs>
    <filter id="shadow-a" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <style>
      text { fill: currentColor; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" rx="16" fill="none" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Kubernetes Production Best Practices -- Page Architecture</text>
  <line x1="60" y1="50" x2="900" y2="50" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ===== SECTION 1: Application Development (Green) ===== -->
  <rect x="20" y="62" width="300" height="570" rx="12" fill="#16a34a" fill-opacity="0.07" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow-a)"/>
  <rect x="20" y="62" width="300" height="36" rx="12" fill="#16a34a" fill-opacity="0.18"/>
  <text x="170" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Section 1: Application Development</text>
