  <text x="346" y="146" font-size="13" font-weight="600" fill="#9a3412">Pod Security</text>
  <text x="530" y="146" text-anchor="end" font-size="12" fill="#ea580c" font-weight="500">(6)</text>
  <!-- STALE badge -->
  <rect x="540" y="134" width="60" height="18" rx="9" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1"/>
  <text x="570" y="147" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">STALE</text>
  <rect x="346" y="152" width="268" height="1" fill="#ea580c" fill-opacity="0.15"/>

  <text x="346" y="172" font-size="13" font-weight="600" fill="#9a3412">Network Policies</text>
  <text x="590" y="172" text-anchor="end" font-size="12" fill="#ea580c" font-weight="500">(2)</text>
  <rect x="346" y="178" width="268" height="1" fill="#ea580c" fill-opacity="0.15"/>

  <text x="346" y="198" font-size="13" font-weight="600" fill="#9a3412">RBAC</text>
  <text x="590" y="198" text-anchor="end" font-size="12" fill="#ea580c" font-weight="500">(3)</text>
  <rect x="346" y="204" width="268" height="1" fill="#ea580c" fill-opacity="0.15"/>

  <text x="346" y="224" font-size="13" font-weight="600" fill="#9a3412">Custom Policies</text>
  <text x="590" y="224" text-anchor="end" font-size="12" fill="#ea580c" font-weight="500">(3)</text>

