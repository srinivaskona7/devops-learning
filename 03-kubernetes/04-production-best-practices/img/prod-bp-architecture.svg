  <text x="656" y="120" font-size="13" font-weight="600" fill="#1e40af">Approved Config</text>
  <text x="900" y="120" text-anchor="end" font-size="12" fill="#2563eb" font-weight="500">(3)</text>
  <rect x="656" y="126" width="268" height="1" fill="#2563eb" fill-opacity="0.15"/>

  <text x="656" y="146" font-size="13" font-weight="600" fill="#1e40af">Authentication</text>
  <text x="900" y="146" text-anchor="end" font-size="12" fill="#2563eb" font-weight="500">(1)</text>
  <rect x="656" y="152" width="268" height="1" fill="#2563eb" fill-opacity="0.15"/>

  <text x="656" y="172" font-size="13" font-weight="600" fill="#1e40af">RBAC Cluster</text>
  <text x="900" y="172" text-anchor="end" font-size="12" fill="#2563eb" font-weight="500">(1)</text>
  <rect x="656" y="178" width="268" height="1" fill="#2563eb" fill-opacity="0.15"/>

  <text x="656" y="198" font-size="13" font-weight="600" fill="#1e40af">Logging Setup</text>
  <text x="900" y="198" text-anchor="end" font-size="12" fill="#2563eb" font-weight="500">(4)</text>

  <!-- ===== Score Badge ===== -->
  <rect x="300" y="660" width="360" height="44" rx="22" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5"/>
  <text x="380" y="688" text-anchor="middle" font-size="26" font-weight="800" fill="#ea580c">7/10</text>
  <text x="540" y="687" text-anchor="middle" font-size="16" font-weight="500" fill="currentColor" fill-opacity="0.7">Solid but aging</text>

  <!-- Connecting lines between sections (decorative) -->
  <line x1="320" y1="347" x2="330" y2="347" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="630" y1="347" x2="640" y2="347" stroke="currentColor" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>