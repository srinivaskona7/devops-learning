<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" font-family="system-ui, sans-serif">
  <defs>
    <filter id="shadow-s" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Security Layers -- Defense in Depth</text>
  <line x1="100" y1="48" x2="820" y2="48" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Left arrow label -->
  <line x1="60" y1="140" x2="60" y2="700" stroke="currentColor" stroke-opacity="0.25" stroke-width="2" marker-start="url(#arrow-up)"/>
  <polygon points="60,130 55,150 65,150" fill="currentColor" fill-opacity="0.35"/>
  <text x="36" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" fill-opacity="0.5" transform="rotate(-90, 36, 380)">OUTER    ---    INNER</text>

  <!-- ===== Layer 6: Admission Controllers (Purple, widest) ===== -->
  <rect x="100" y="620" width="760" height="100" rx="16" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-width="2" filter="url(#shadow-s)"/>
  <rect x="100" y="620" width="760" height="32" rx="16" fill="#7c3aed" fill-opacity="0.14"/>
  <text x="120" y="643" font-size="14" font-weight="700" fill="#6d28d9">Layer 6: Admission Controllers</text>
  <rect x="780" y="626" width="64" height="22" rx="11" fill="#7c3aed" fill-opacity="0.15"/>
  <text x="812" y="641" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">WIDEST</text>

  <text x="120" y="672" font-size="13" fill="#5b21b6" font-weight="500">OPA / Gatekeeper for policy-as-code enforcement</text>
  <text x="120" y="694" font-size="13" fill="#5b21b6" font-weight="500">Validates &amp; mutates admission requests before persistence</text>

  <rect x="620" y="674" width="220" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="730" y="691" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">Missing: Kyverno coverage</text>

  <!-- ===== Layer 5: RBAC (Teal) ===== -->
  <rect x="140" y="510" width="680" height="96" rx="14" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488" stroke-width="2" filter="url(#shadow-s)"/>
  <rect x="140" y="510" width="680" height="30" rx="14" fill="#0d9488" fill-opacity="0.14"/>
  <text x="160" y="531" font-size="14" font-weight="700" fill="#0f766e">Layer 5: RBAC</text>

  <text x="160" y="562" font-size="13" fill="#115e59" font-weight="500">Disable automounting of default ServiceAccount token</text>
  <text x="160" y="584" font-size="13" fill="#115e59" font-weight="500">Zalando 5-role model: viewer, editor, admin, cluster-admin, super-admin</text>

  <!-- ===== Layer 4: Network Policies (Indigo) ===== -->
  <rect x="180" y="406" width="600" height="90" rx="14" fill="#4f46e5" fill-opacity="0.06" stroke="#4f46e5" stroke-width="2" filter="url(#shadow-s)"/>
  <rect x="180" y="406" width="600" height="30" rx="14" fill="#4f46e5" fill-opacity="0.14"/>
  <text x="200" y="427" font-size="14" font-weight="700" fill="#4338ca">Layer 4: Network Policies</text>

  <text x="200" y="458" font-size="13" fill="#3730a3" font-weight="500">Default deny-all ingress &amp; egress per namespace</text>
  <text x="200" y="478" font-size="13" fill="#3730a3" font-weight="500">Explicitly allow only required pod-to-pod &amp; external traffic</text>

  <!-- ===== Layer 3: Container Hardening (Pink) ===== -->
  <rect x="220" y="308" width="520" height="84" rx="14" fill="#db2777" fill-opacity="0.06" stroke="#db2777" stroke-width="2" filter="url(#shadow-s)"/>
  <rect x="220" y="308" width="520" height="30" rx="14" fill="#db2777" fill-opacity="0.14"/>
  <text x="240" y="329" font-size="14" font-weight="700" fill="#be185d">Layer 3: Container Hardening</text>

  <text x="240" y="358" font-size="13" fill="#9d174d" font-weight="500">Read-only root filesystem</text>
  <text x="480" y="358" font-size="13" fill="#9d174d" font-weight="500">Run as non-root</text>
  <text x="240" y="378" font-size="13" fill="#9d174d" font-weight="500">Drop ALL capabilities, add only needed (NET_BIND_SERVICE, etc.)</text>

  <!-- ===== Layer 2: Pod Security (Orange) ===== -->
  <rect x="260" y="206" width="440" height="88" rx="14" fill="#ea580c" fill-opacity="0.06" stroke="#ea580c" stroke-width="2" filter="url(#shadow-s)"/>
  <rect x="260" y="206" width="440" height="30" rx="14" fill="#ea580c" fill-opacity="0.14"/>
  <text x="280" y="227" font-size="14" font-weight="700" fill="#c2410c">Layer 2: Pod Security</text>

  <!-- PSP REMOVED badge -->
  <rect x="440" y="212" width="120" height="20" rx="10" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="500" y="226" text-anchor="middle" font-size="10" font-weight="800" fill="#dc2626">PSP REMOVED</text>

  <text x="280" y="258" font-size="13" fill="#9a3412" font-weight="500">Use Pod Security Admission (PSA) instead of PSP</text>
  <text x="280" y="278" font-size="13" fill="#9a3412" font-weight="500">Enforce restricted / baseline / privileged profiles per namespace</text>

  <!-- ===== Layer 1: Namespace Isolation (Blue, narrowest) ===== -->
  <rect x="310" y="110" width="340" height="82" rx="14" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="2" filter="url(#shadow-s)"/>
  <rect x="310" y="110" width="340" height="30" rx="14" fill="#2563eb" fill-opacity="0.14"/>
  <text x="330" y="131" font-size="14" font-weight="700" fill="#1d4ed8">Layer 1: Namespace Isolation</text>
  <rect x="580" y="116" width="56" height="20" rx="10" fill="#2563eb" fill-opacity="0.15"/>
  <text x="608" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">INNER</text>

  <text x="330" y="160" font-size="13" fill="#1e40af" font-weight="500">LimitRange: per-container CPU/mem defaults &amp; ceilings</text>
  <text x="330" y="180" font-size="13" fill="#1e40af" font-weight="500">ResourceQuota: total namespace resource budgets</text>

  <!-- ===== Legend at bottom ===== -->
  <rect x="100" y="736" width="760" height="34" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.1" stroke-width="1"/>
  <text x="120" y="758" font-size="12" fill="currentColor" fill-opacity="0.5" font-weight="500">Wider layers = broader blast radius.</text>
  <text x="400" y="758" font-size="12" fill="currentColor" fill-opacity="0.5" font-weight="500">Start from the outer layer and work inward.</text>
  <text x="690" y="758" font-size="12" fill="currentColor" fill-opacity="0.5" font-weight="500">Every layer must hold independently.</text>
</svg>