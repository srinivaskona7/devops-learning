---
# STABLE: 9 replicas of v1. Common label app=hello-canary-app so Service picks both.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-stable
  labels:
    app: hello-canary-app
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: hello-canary-app
      track: stable
  template:
    metadata:
      labels:
        app: hello-canary-app
        track: stable
        version: v1
    spec:
      containers:
        - name: hello
          image: gcr.io/google-samples/hello-app:1.0
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
