---
# Argo Rollouts canary with stepped traffic and SLI-driven analysis.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-rollout
spec:
  replicas: 5
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: hello-rollout
  template:
    metadata:
      labels:
        app: hello-rollout
        version: v1
    spec:
      containers:
        - name: hello
          image: gcr.io/google-samples/hello-app:1.0
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
  strategy:
    canary:
      # Optional: with Istio/NGINX/ALB this gives true % traffic split
      # trafficRouting:
      #   istio:
      #     virtualService:
      #       name: hello-vs
      #       routes: [primary]
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: service-name
                value: hello-rollout
        - setWeight: 40
        - pause: { duration: 30s }
        - setWeight: 60
        - pause: { duration: 30s }
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: hello-rollout
spec:
  selector:
    app: hello-rollout
  ports:
    - port: 80
      targetPort: 8080
