apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-indexed
spec:
  completions: 5
  parallelism: 5
  completionMode: Indexed
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "I am worker $JOB_COMPLETION_INDEX of $JOB_COMPLETIONS"
              # Use the index to pick a shard, partition, etc.
              sleep $((RANDOM % 10))
          env:
            - name: JOB_COMPLETIONS
              value: "5"
