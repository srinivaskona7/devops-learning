# StatefulSet — each replica gets stable identity (cache-0, cache-1) + own PVC
apiVersion: v1
kind: Service
metadata:
  name: cache
  labels:
    app: cache
spec:
  clusterIP: None                  # ← headless: stable DNS per pod
  selector:
    app: cache
  ports:
    - port: 6379
      name: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  labels:
    app: cache
    component: data
spec:
  serviceName: cache               # ← MUST match the headless Service above
  replicas: 2
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
        component: data
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data    # ← redis persists here
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
  volumeClaimTemplates:            # ← one PVC per replica, automatically
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
