# NodePort service — exposes on every node IP at a static port
apiVersion: v1
kind: Service
metadata:
  name: hello-app-np
  labels:
    app: hello-app
    component: web
spec:
  type: NodePort
  selector:
    app: hello-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080              # ← optional; auto-assigned in 30000–32767 if omitted
      protocol: TCP
