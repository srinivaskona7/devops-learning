# ClusterIP service — internal-only stable VIP
apiVersion: v1
kind: Service
metadata:
  name: hello-app
  labels:
    app: hello-app
    component: web
spec:
  type: ClusterIP                  # ← default; could be omitted
  selector:
    app: hello-app                 # ← matches Deployment pod labels
  ports:
    - name: http
      port: 80                     # ← service port
      targetPort: 8080             # ← container port
      protocol: TCP
