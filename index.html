    <!-- SPA 404 redirect restore: reads a path pushed by public/404.html and rewrites history. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search.indexOf('?p=') === 0 || l.search.indexOf('&p=') !== -1) {
          var query = l.search.slice(1).split('&').reduce(function (a, kv) {
            var i = kv.indexOf('='); if (i < 0) return a;
            a[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/~and~/g, '&'));
            return a;
          }, {});
          if (query.p !== undefined) {
            var newPath = l.pathname.replace(/\/$/, '') + (query.p[0] === '/' ? query.p : '/' + query.p) + (query.q ? '?' + query.q : '') + l.hash;
            window.history.replaceState(null, '', newPath);
          }
        }
      })();
    </script>
